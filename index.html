<style>/* ============================================================
   base.css — CSS変数・リセット・フォント・アニメーション
   全ページ共通。ここだけ変えれば色・フォントが全体に反映される
   ============================================================ */

/* ---------- Google Fonts ---------- */
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap');

/* ---------- カラー変数 ---------- */
:root {
  /* 背景 */
  --bg  : #F5F5F8;
  --bg2 : #FFFFFF;
  --bg3 : #EDEDF2;

  /* カード */
  --card  : #FFFFFF;
  --card2 : #F5F5F8;

  /* アクセントカラー */
  --or  : #FF5A00;   /* オレンジ（メインアクセント） */
  --or2 : #FF7A30;   /* オレンジ薄め */
  --rd  : #E53535;   /* 赤（LIVE・エラー） */
  --gr  : #00A855;   /* 緑（成功・オンライン） */
  --cy  : #0088CC;   /* 青（アウェイチーム） */
  --go  : #D4900A;   /* 金（ランキング1位） */

  /* テキスト */
  --tx  : #111118;   /* メインテキスト */
  --tx2 : #44445A;   /* サブテキスト */
  --tx3 : #8A8AA8;   /* プレースホルダー・ラベル */

  /* ボーダー */
  --bd  : rgba(0, 0, 0, 0.07);
  --bd2 : rgba(255, 90, 0, 0.25);

  /* 角丸 */
  --r-sm : 4px;
  --r-md : 8px;
  --r-lg : 12px;

  /* シャドウ */
  --shadow-sm : 0 2px 8px rgba(0,0,0,.06);
  --shadow-md : 0 8px 32px rgba(0,0,0,.12);
  --shadow-lg : 0 16px 48px rgba(0,0,0,.20);
}

/* ---------- リセット ---------- */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  overscroll-behavior: none;
}

html {
  background: #111;
}

body {
  background: var(--bg);
  color: var(--tx);
  font-family: 'Barlow', sans-serif;
  font-size: 16px;
  line-height: 1.5;
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: 100%;
  box-shadow: 0 0 40px rgba(0,0,0,.3);
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

input, textarea {
  font-family: inherit;
}

img {
  display: block;
  max-width: 100%;
}

a {
  color: inherit;
  text-decoration: none;
}

/* ---------- フォントユーティリティ ---------- */
.font-bebas  { font-family: 'Bebas Neue', sans-serif; }
.font-bc     { font-family: 'Barlow Condensed', sans-serif; }
.font-mono   { font-family: 'Space Mono', monospace; }

/* ---------- アニメーション ---------- */
@keyframes bl {
  0%, 100% { opacity: 1; }
  50%       { opacity: .1; }
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: .3; transform: scale(1.5); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes popIn {
  from { opacity: 0; transform: scale(.95); }
  to   { opacity: 1; transform: scale(1); }
}

@keyframes slideIn {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: translateX(0); }
}

@keyframes shimmer {
  0%   { background-position:  200% 0; }
  100% { background-position: -200% 0; }
}

/* ---------- 共通バッジ ---------- */
.badge {
  display: inline-flex;
  align-items: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .6rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: .1rem .4rem;
  border-radius: var(--r-sm);
}

.badge-live    { background: var(--rd);  color: #fff; }
.badge-season  { background: var(--or);  color: #fff; }
.badge-playin  { background: #D4900A;    color: #fff; }
.badge-playoff { background: #6B3AED;    color: #fff; }
.badge-po      { background: rgba(0,212,106,.12); color: var(--gr); }
.badge-pi     { background: rgba(255,184,0,.12); color: var(--go); }

/* ---------- ページタイトル ---------- */
.pg-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--tx2);
  margin-bottom: .75rem;
  display: flex;
  align-items: center;
  gap: .4rem;
}

/* ---------- コンフボタン（イースト/ウェスト切り替え） ---------- */
.conf-row {
  display: flex;
  gap: .35rem;
  margin-bottom: .65rem;
}

.conf-btn {
  flex: 1;
  padding: .35rem;
  border-radius: var(--r-md);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  border: 1px solid var(--bd);
  background: transparent;
  color: var(--tx3);
  cursor: pointer;
  text-align: center;
  transition: all .15s;
}

.conf-btn.on {
  background: var(--or);
  color: #fff;
  border-color: transparent;
}

/* ---------- mark（検索ハイライト） ---------- */
mark {
  background: rgba(255,90,0,.25);
  color: var(--or);
  border-radius: 2px;
  padding: 0 1px;
  font-weight: 700;
}

/* ---------- スクロールバー ---------- */
::-webkit-scrollbar        { width: 2px; height: 2px; }
::-webkit-scrollbar-thumb  { background: rgba(255,90,0,.3); border-radius: 1px; }
::-webkit-scrollbar-track  { background: transparent; }
/* ============================================================
   layout.css — ナビ・タブ・全体レイアウト・試合カード
   ここを触っても他の機能には影響しない
   ============================================================ */

/* ===== TOP ナビ ===== */
.top-nav {
  flex-shrink: 0;
  height: 52px;
  background: rgba(255,255,255,.97);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--bd);
  display: flex;
  align-items: center;
  padding: 0 1rem;
  gap: .6rem;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.65rem;
  letter-spacing: .2em;
  color: var(--or);
  text-shadow: 0 0 20px rgba(255,90,0,.4);
  flex-shrink: 0;
}
.logo span { color: var(--tx); opacity: .7; }

.nav-sp { flex: 1; }

/* オンライン人数 */
.nav-online {
  display: flex;
  align-items: center;
  gap: .25rem;
  background: rgba(0,168,85,.1);
  border: 1px solid rgba(0,168,85,.25);
  padding: .18rem .5rem;
  border-radius: 4px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .65rem;
  font-weight: 700;
  color: #00A855;
  letter-spacing: .04em;
}
.nav-online-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #00A855;
  display: inline-block;
  animation: pulse 1.5s infinite;
  flex-shrink: 0;
}

/* 検索ボタン */
.nav-search {
  width: 34px;
  height: 34px;
  border-radius: 6px;
  background: var(--card);
  border: 1px solid var(--bd);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .95rem;
  cursor: pointer;
  color: var(--tx2);
}

/* ===== タブ ナビ ===== */
.second-nav {
  flex-shrink: 0;
  background: #FFFFFF;
  border-bottom: 1px solid var(--bd);
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  width: 100%;
}
.second-nav::-webkit-scrollbar { display: none; }

.sn {
  flex: 1;
  padding: 0 .2rem;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .02em;
  text-transform: uppercase;
  color: var(--tx3);
  border: none;
  background: transparent;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: all .15s;
}
.sn.on {
  color: var(--or);
  border-bottom-color: var(--or);
}

.sn-divider {
  width: 1px;
  background: var(--bd);
  flex-shrink: 0;
  margin: .6rem 0;
}

/* ===== メインスクロール ===== */
.main {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
.main::-webkit-scrollbar       { width: 2px; }
.main::-webkit-scrollbar-thumb { background: rgba(255,90,0,.3); border-radius: 1px; }

/* ===== フッター ===== */
.footer {
  flex-shrink: 0;
  height: 44px;
  background: #FFFFFF;
  border-top: 1px solid var(--bd);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1rem;
}
.foot-links { display: flex; gap: .7rem; }
.foot-link {
  font-size: .58rem;
  color: var(--tx3);
  cursor: pointer;
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: .06em;
}
.foot-copy {
  font-family: 'Space Mono', monospace;
  font-size: .5rem;
  color: var(--tx3);
}

/* ===== ページ共通 ===== */
.pg { display: none; padding: .9rem; animation: fadeUp .2s ease; }
.pg.show { display: block; }

/* ===== 日付バー ===== */
.date-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: .55rem .85rem;
  margin-bottom: .75rem;
}
.db-center { text-align: center; }
.db-date {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  letter-spacing: .08em;
  color: var(--tx);
}
.db-sub {
  font-size: .62rem;
  color: var(--tx3);
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: .06em;
}
.db-today {
  font-size: .58rem;
  background: var(--or);
  color: #fff;
  padding: .06rem .35rem;
  border-radius: 3px;
  margin-left: .3rem;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  letter-spacing: .08em;
}
.db-btn {
  width: 30px;
  height: 30px;
  border-radius: 6px;
  background: var(--bg3);
  border: 1px solid var(--bd);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .9rem;
  color: var(--tx2);
  cursor: pointer;
}
.db-btn:active { background: var(--card2); }

/* ===== 試合カード ===== */
.gc {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  margin-bottom: .5rem;
  transition: border-color .15s, transform .1s;
}
.gc:active      { transform: scale(.99); }
.gc.live        { border-color: rgba(255,59,59,.25); }
.gc.selected    { border-color: var(--or); }
.gc-accent      { height: 2px; }
.accent-live    { background: linear-gradient(90deg, var(--rd), transparent); }
.accent-pre     { background: linear-gradient(90deg, var(--tx3), transparent); }
.accent-fin     { background: linear-gradient(90deg, var(--gr), transparent); }

.gc-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: .35rem .75rem;
  border-bottom: 1px solid var(--bd);
}
.gc-status {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .65rem;
  font-weight: 700;
  letter-spacing: .12em;
  display: flex;
  align-items: center;
  gap: .25rem;
}
.gc-status.live        { color: var(--rd); }
.gc-status.live::before {
  content: '';
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--rd);
  animation: bl .8s infinite;
}
.gc-status.pre { color: var(--tx3); }
.gc-status.fin { color: var(--gr); }

.gc-note {
  font-size: .6rem;
  color: var(--or);
  font-family: 'Barlow', sans-serif;
  font-weight: 500;
  max-width: 170px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.gc-upd {
  font-family: 'Space Mono', monospace;
  font-size: .48rem;
  color: var(--tx3);
}

.gc-body { display: flex; align-items: center; padding: .65rem .75rem; }
.gc-team { flex: 1; display: flex; flex-direction: column; align-items: flex-start; }
.gc-team.r { text-align: right; align-items: flex-end; }
.gc-city {
  font-size: .52rem;
  color: var(--tx3);
  margin-bottom: .06rem;
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.gc-logo { width: 42px; height: 42px; object-fit: contain; margin-bottom: .25rem; }
.gc-abbr {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.35rem;
  letter-spacing: .06em;
  color: var(--tx);
  line-height: 1;
}
.gc-rec {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .56rem;
  color: var(--tx3);
  letter-spacing: .04em;
  margin-top: .1rem;
}

.gc-center { text-align: center; padding: 0 .6rem; min-width: 80px; }
.gc-vs {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1rem;
  color: var(--tx3);
  letter-spacing: .12em;
}
.gc-score {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2rem;
  letter-spacing: .04em;
  color: var(--tx);
  line-height: 1;
}
.gc-score-sep { color: var(--tx3); margin: 0 .15rem; font-size: 1.6rem; }
.gc-win { color: var(--tx); }
.gc-lose { color: var(--tx3); }
.gc-time-left {
  font-family: 'Space Mono', monospace;
  font-size: .58rem;
  color: var(--rd);
  margin-top: .15rem;
}
.gc-start {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .7rem;
  color: var(--tx3);
  letter-spacing: .08em;
}

/* ===== 試合詳細パネル ===== */
.detail-panel {
  border-top: 1px solid var(--bd);
  background: var(--bg3);
  overflow: hidden;
  max-height: 0;
  transition: max-height .3s ease;
}
.detail-panel.open { max-height: 2000px; }

/* ===== スタッツ系ボタン ===== */
.stat-type-btn {
  flex: 1;
  padding: .3rem;
  border-radius: 6px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .06em;
  border: 1px solid var(--bd);
  background: transparent;
  color: var(--tx3);
  cursor: pointer;
}
.stat-type-btn.on {
  background: var(--or);
  color: #fff;
  border-color: transparent;
}

/* ===== 並び替えボタン（動画ページ） ===== */
.sort-btn {
  padding: .28rem .65rem;
  border-radius: 5px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: .66rem;
  font-weight: 700;
  letter-spacing: .06em;
  border: 1px solid var(--bd);
  background: transparent;
  color: var(--tx3);
  cursor: pointer;
}
.sort-btn.on {
  background: var(--or);
  color: #fff;
  border-color: transparent;
}

/* ===== メディアフィルター（記事ページ） ===== */
.media-filter-btn {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .2rem;
  cursor: pointer;
  padding: .4rem .5rem;
  border-radius: 8px;
  border: 1px solid var(--bd);
  background: var(--card);
  min-width: 62px;
}
.media-filter-btn.active-media {
  border-color: var(--or);
  background: var(--bg3);
}
.media-icon {
  width: 34px; height: 34px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-size: 1rem;
  color: #fff;
}
.media-icon img {
  width: 20px; height: 20px;
  object-fit: contain;
}
.media-name {
  font-size: .52rem;
  font-weight: 700;
  color: var(--tx);
  text-align: center;
  line-height: 1.2;
}
.media-sub {
  font-size: .44rem;
  color: var(--tx3);
  text-align: center;
}

/* ===== 選手ページ 検索 ===== */
.player-search-input {
  width: 100%;
  padding: .42rem .6rem .42rem 1.8rem;
  border-radius: 6px;
  border: 1px solid var(--bd);
  background: var(--bg3);
  color: var(--tx);
  font-size: .72rem;
  outline: none;
  box-sizing: border-box;
}

/* ============================================================
   schedule.css — 試合詳細パネル・スコアボード・選手カード
   ============================================================ */

/* ===== 試合カード 追加スタイル ===== */
.gc-mid { flex: 1; text-align: center; padding: 0 .4rem; }
.gc-q   { font-family:'Barlow Condensed',sans-serif; font-size:.68rem; color:var(--tx3); letter-spacing:.08em; }
.gc-t   { font-family:'Space Mono',monospace; font-size:.65rem; color:var(--rd); font-weight:700; }
.gc-vs  { font-family:'Bebas Neue',sans-serif; font-size:1.3rem; color:var(--tx3); }
.gc-st  { font-family:'Barlow Condensed',sans-serif; font-size:.62rem; color:var(--tx3); }
.gc-end { font-family:'Barlow Condensed',sans-serif; font-size:.68rem; color:var(--gr); font-weight:700; letter-spacing:.06em; }
.gc-win { color: var(--or); }

/* ===== 詳細パネル ===== */
.detail-panel {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: .6rem;
  display: none;
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
}
.detail-panel.open { display: block; animation: popIn .2s ease; }

/* ===== スコアボード ===== */
.sbd {
  background: linear-gradient(160deg,#0E0A1A,#08121E);
  padding: .9rem;
  position: relative;
  overflow: hidden;
}
.sbd::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg,var(--or),var(--rd),transparent);
}
.sbd-glow {
  position: absolute;
  width: 200px; height: 200px;
  border-radius: 50%;
  filter: blur(60px);
  pointer-events: none;
  background: rgba(255,90,0,.08);
  top: -60px; right: -60px;
}
.sbd-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .75rem; }
.sbd-badge-live {
  display: flex; align-items: center; gap: .25rem;
  font-family:'Barlow Condensed',sans-serif; font-size:.65rem; font-weight:700;
  color: var(--rd); letter-spacing: .12em;
}
.sbd-badge-live::before { content:''; width:5px; height:5px; border-radius:50%; background:var(--rd); animation:bl .8s infinite; }
.sbd-badge-fin { font-family:'Barlow Condensed',sans-serif; font-size:.65rem; font-weight:700; color:var(--gr); letter-spacing:.12em; }
.sbd-badge-pre { font-family:'Barlow Condensed',sans-serif; font-size:.65rem; color:var(--tx3); letter-spacing:.1em; }
.sbd-q   { font-family:'Barlow Condensed',sans-serif; font-size:.65rem; color:rgba(255,255,255,.35); letter-spacing:.08em; }
.sbd-upd { font-family:'Space Mono',monospace; font-size:.48rem; color:rgba(255,255,255,.18); }

.sbd-scores { display: flex; align-items: center; justify-content: space-between; }
.sbt        { flex: 1; text-align: center; }
.sbt-city   { font-family:'Barlow Condensed',sans-serif; font-size:.52rem; color:rgba(255,255,255,.28); text-transform:uppercase; letter-spacing:.1em; margin-bottom:.12rem; }
.sbt-abbr   { font-family:'Bebas Neue',sans-serif; font-size:1.8rem; letter-spacing:.1em; color:#fff; }
.sbt-score  { font-family:'Bebas Neue',sans-serif; font-size:4rem; line-height:1; color:#fff; }
.sbt-score.ld { color:var(--or); text-shadow:0 0 20px rgba(255,90,0,.3); }
.sbd-mid    { text-align:center; padding:0 .4rem; }
.sbd-sep    { font-family:'Bebas Neue',sans-serif; font-size:1.8rem; color:rgba(255,255,255,.15); }
.sbd-clk    { font-family:'Space Mono',monospace; font-size:.72rem; color:var(--go); margin-top:.15rem; }

/* クォータースコア行 */
.q-row  { display:flex; border-top:1px solid rgba(255,255,255,.05); margin-top:.75rem; }
.qi     { flex:1; padding:.42rem .18rem; text-align:center; border-right:1px solid rgba(255,255,255,.04); }
.qi:last-child { border-right: none; }
.qi-l   { font-family:'Barlow Condensed',sans-serif; font-size:.5rem; color:rgba(255,255,255,.22); letter-spacing:.08em; margin-bottom:.12rem; }
.qi-h   { font-family:'Bebas Neue',sans-serif; font-size:.78rem; color:#fff; }
.qi-h.cur { color: var(--go); }
.qi-a   { font-size:.74rem; color:rgba(255,255,255,.35); }

/* ===== 選手スタッツエリア ===== */
.stats-area  { padding: .75rem .85rem; }
.area-label  {
  font-family:'Barlow Condensed',sans-serif;
  font-size:.72rem; font-weight:700; letter-spacing:.1em;
  text-transform: uppercase; color:var(--tx2);
  margin-bottom: .5rem;
  display: flex; align-items:center; justify-content:space-between;
}
.on-legend   { display:flex; align-items:center; gap:.22rem; font-size:.6rem; color:var(--tx3); font-weight:400; text-transform:none; letter-spacing:0; }
.on-dot      { width:5px; height:5px; border-radius:50%; background:var(--gr); display:inline-block; animation:pulse 1.5s infinite; }
.p2col       { display:grid; grid-template-columns:1fr 1fr; gap:.4rem; }

.col-hdr { font-family:'Barlow Condensed',sans-serif; font-size:.62rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:.2rem .42rem; border-radius:4px; text-align:center; margin-bottom:.3rem; }
.col-h   { color:var(--or); background:rgba(255,90,0,.1); }
.col-a   { color:var(--cy); background:rgba(0,200,255,.08); }

/* 選手カード */
.pcrd         { border:1px solid var(--bd); border-radius:6px; padding:.44rem .4rem; margin-bottom:.26rem; background:var(--bg3); }
.pcrd.on-c    { border-color:rgba(0,212,106,.2); background:rgba(0,212,106,.04); }
.pcrd.hot     { border-color:rgba(255,90,0,.2); background:rgba(255,90,0,.04); }
.pcrd.bench   { opacity:.4; }
.p-top  { display:flex; align-items:center; gap:.15rem; margin-bottom:.2rem; }
.p-num  { font-family:'Bebas Neue',sans-serif; font-size:.9rem; color:var(--tx3); width:15px; flex-shrink:0; }
.p-nm   { font-size:.68rem; font-weight:600; color:var(--tx); }
.p-nm.oc{ color:var(--gr); }
.p-nm.hc{ color:var(--or); }
.p-pos  { font-family:'Barlow Condensed',sans-serif; font-size:.52rem; color:var(--tx3); letter-spacing:.06em; }
.cdot   { display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--gr); margin-right:.12rem; animation:pulse 1.5s infinite; }
.pf     { font-size:.6rem; margin-left:auto; }
.p-sts  { display:grid; grid-template-columns:repeat(4,1fr); text-align:center; }
.sv     { font-family:'Space Mono',monospace; font-size:.66rem; font-weight:700; color:var(--tx); }
.sv.hi  { color:var(--or); }
.sv.pos { color:var(--gr); }
.sv.neg { color:var(--rd); }
.sl     { font-family:'Barlow Condensed',sans-serif; font-size:.46rem; color:var(--tx3); letter-spacing:.04em; }
.no-stats { text-align:center; padding:1rem; font-size:.74rem; color:var(--tx3); }

/* ===== ゲーム内チャット ===== */
.chat-area  { padding:.1rem .85rem .85rem; }
.chat-label { font-family:'Barlow Condensed',sans-serif; font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--tx2); margin-bottom:.5rem; display:flex; align-items:center; gap:.45rem; }
.chat-lv    { font-size:.6rem; color:var(--tx3); font-weight:400; text-transform:none; letter-spacing:0; }
.chat-box   { background:var(--bg3); border:1px solid var(--bd); border-radius:8px; overflow:hidden; }
.chat-msgs  { padding:.65rem; height:280px; overflow-y:auto; display:flex; flex-direction:column; gap:.55rem; }
.chat-msgs::-webkit-scrollbar       { width:2px; }
.chat-msgs::-webkit-scrollbar-thumb { background:rgba(255,90,0,.3); border-radius:1px; }
.chat-inp { display:flex; align-items:center; gap:.35rem; padding:.48rem .65rem; background:var(--bg3); border-top:1px solid var(--bd); }
.ci-field { flex:1; background:rgba(255,255,255,.9); border:1px solid var(--bd); border-radius:20px; padding:.35rem .7rem; font-size:.75rem; color:var(--tx); outline:none; font-family:'Barlow',sans-serif; }
.ci-field::placeholder { color:var(--tx3); }
.ci-send  { width:27px; height:27px; border-radius:50%; background:var(--or); border:none; cursor:pointer; font-size:.72rem; display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; }

/* チャットメッセージ共通 */
.cm { display:flex; gap:.42rem; animation:slideIn .18s ease; }
.cm.me { flex-direction:row-reverse; }
.cav  { width:24px; height:24px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:.64rem; font-weight:700; font-family:'Barlow Condensed',sans-serif; }
.cao  { background:var(--or); color:#fff; }
.cat  { background:#0070CC; color:#fff; }
.cap  { background:#6B3AED; color:#fff; }
.cag  { background:#00A855; color:#fff; }
.can  { background:#CC7A00; color:#fff; }
.cam  { background:linear-gradient(135deg,var(--or),var(--rd)); color:#fff; }
.cbody { max-width:78%; }
.cm.me .cbody { align-items:flex-end; display:flex; flex-direction:column; }
.cname  { font-family:'Barlow Condensed',sans-serif; font-size:.58rem; font-weight:600; color:var(--tx3); margin-bottom:.1rem; letter-spacing:.04em; }
.cadm   { font-size:.46rem; font-weight:700; background:var(--or); padding:.02rem .24rem; border-radius:2px; color:#fff; margin-left:.12rem; }
.cbbl   { padding:.4rem .58rem; border-radius:6px; font-size:.76rem; color:var(--tx); line-height:1.5; background:#F5F5F8; border:1px solid var(--bd); }
.cm.me .cbbl { background:var(--or); color:#fff; border:none; }
.ctime  { font-family:'Space Mono',monospace; font-size:.46rem; color:var(--tx3); margin-top:.08rem; }
.sys-msg { text-align:center; padding:.3rem .5rem; font-family:'Barlow Condensed',sans-serif; font-size:.6rem; color:var(--tx3); letter-spacing:.04em; }
.qreact { display:flex; gap:.2rem; padding:.3rem .65rem; background:rgba(0,0,0,.03); border-top:1px solid var(--bd); overflow-x:auto; scrollbar-width:none; }
.qreact::-webkit-scrollbar { display:none; }
.qr     { flex-shrink:0; font-size:.95rem; cursor:pointer; padding:.1rem .22rem; border-radius:4px; transition:transform .1s; }
.qr:active { transform:scale(1.35); }
/* ============================================================
   stats.css — スタッツリーダー・順位表
   ============================================================ */

.stat-cats { display:flex; gap:.3rem; overflow-x:auto; scrollbar-width:none; margin-bottom:.75rem; }
.stat-cats::-webkit-scrollbar { display:none; }
.scat {
  flex-shrink:0; padding:.3rem .8rem; border-radius:4px;
  font-family:'Barlow Condensed',sans-serif; font-size:.72rem; font-weight:700; letter-spacing:.08em;
  border:1px solid var(--bd); background:transparent; color:var(--tx3); cursor:pointer;
  text-transform:uppercase; transition:all .15s;
}
.scat.on { background:var(--or); color:#fff; border-color:transparent; }

/* リーダーリスト */
.leader-list { display:flex; flex-direction:column; gap:.42rem; }
.lc {
  background:var(--card); border:1px solid var(--bd); border-radius:8px;
  padding:.65rem .85rem; display:flex; align-items:center; gap:.65rem;
  animation:slideIn .18s ease; cursor:pointer;
}
.lc.t1 { border-left:3px solid var(--go); }
.lc.t2 { border-left:3px solid rgba(192,192,192,.5); }
.lc.t3 { border-left:3px solid rgba(205,127,50,.5); }
.lc-rank { font-family:'Bebas Neue',sans-serif; font-size:1.5rem; width:24px; text-align:center; flex-shrink:0; }
.r1 { color:var(--go); }
.r2 { color:#A0A0B8; }
.r3 { color:#8B6040; }
.lc-info { flex:1; min-width:0; }
.lc-name { font-size:.82rem; font-weight:600; color:var(--tx); margin-bottom:.1rem; }
.lc-sub  { font-family:'Barlow Condensed',sans-serif; font-size:.62rem; color:var(--tx3); letter-spacing:.06em; }
.lc-val  { text-align:right; flex-shrink:0; }
.lc-v    { font-family:'Bebas Neue',sans-serif; font-size:2rem; line-height:1; color:var(--tx); }
.lc-v.gold { color:var(--go); }
.lc-u    { font-family:'Barlow Condensed',sans-serif; font-size:.56rem; color:var(--tx3); letter-spacing:.06em; }

/* 順位表 */
.sw       { background:var(--card); border:1px solid var(--bd); border-radius:8px; overflow:hidden; }
.sw-head  { display:flex; background:rgba(0,0,0,.03); border-bottom:1px solid var(--bd); padding:.38rem .65rem; gap:.25rem; }
.sw-cn    { flex:2; font-family:'Barlow Condensed',sans-serif; font-size:.58rem; font-weight:700; color:var(--tx3); letter-spacing:.08em; text-transform:uppercase; }
.sw-c     { flex:1; font-family:'Barlow Condensed',sans-serif; font-size:.58rem; font-weight:700; color:var(--tx3); letter-spacing:.08em; text-align:center; }
.sw-row   { display:flex; padding:.44rem .65rem; border-bottom:1px solid var(--bd); align-items:center; gap:.25rem; }
.sw-row:last-child { border-bottom:none; }
.sw-row.po { border-left:2px solid rgba(0,212,106,.3); }
.sw-row.pi { border-left:2px solid rgba(255,184,0,.3); }
.sw-rk    { font-family:'Bebas Neue',sans-serif; font-size:.9rem; color:var(--tx3); width:13px; flex-shrink:0; }
.sw-tm    { flex:2; display:flex; align-items:center; gap:.32rem; }
.sw-logo  { font-size:.82rem; }
.sw-abbr  { font-size:.72rem; font-weight:600; color:var(--tx); }
.sw-badge { font-family:'Barlow Condensed',sans-serif; font-size:.5rem; font-weight:700; padding:.07rem .26rem; border-radius:3px; letter-spacing:.06em; }
.bpo { background:rgba(0,212,106,.12); color:var(--gr); }
.bpi { background:rgba(255,184,0,.12); color:var(--go); }
.sw-n    { flex:1; text-align:center; font-family:'Space Mono',monospace; font-size:.68rem; color:var(--tx); }
.sw-n.hi { color:var(--or); font-weight:700; }
.sw-div1 { height:1px; background:linear-gradient(90deg,rgba(0,212,106,.3),transparent); }
.sw-div2 { height:1px; background:linear-gradient(90deg,rgba(255,184,0,.2),transparent); }

/* 選手モーダル（スタッツページ用） */
#playerModal { overflow-y:auto; }
/* ============================================================
   videos.css — ハイライト動画カード
   ============================================================ */

.vid-card {
  background:var(--card); border:1px solid var(--bd); border-radius:8px;
  overflow:hidden; cursor:pointer; margin-bottom:.5rem;
  transition:transform .1s;
}
.vid-card:active { transform:scale(.99); }

.vid-thumb {
  position:relative; width:100%; padding-top:52%;
  background:linear-gradient(145deg,#1a0a2e,#2d1060);
  overflow:hidden;
}
.vid-info   { padding:.58rem .75rem; }
.vid-title  { font-size:.78rem; font-weight:600; color:var(--tx); line-height:1.4; margin-bottom:.25rem; }
.vid-meta   { display:flex; align-items:center; justify-content:space-between; margin-bottom:.3rem; }
.vid-ch     { font-family:'Barlow Condensed',sans-serif; font-size:.62rem; color:var(--tx3); letter-spacing:.04em; }
.vid-time   { font-family:'Space Mono',monospace; font-size:.56rem; color:var(--tx3); }
.vid-btn    {
  display:inline-flex; align-items:center; gap:.22rem;
  background:var(--rd); color:#fff;
  font-family:'Barlow Condensed',sans-serif; font-size:.65rem; font-weight:700; letter-spacing:.06em;
  padding:.22rem .55rem; border-radius:4px; border:none; cursor:pointer;
}

/* 動画モーダル */
#videoModal {
  position:fixed; inset:0; z-index:300;
  background:rgba(0,0,0,.92); backdrop-filter:blur(12px);
  display:none; flex-direction:column;
  align-items:center; justify-content:center; padding:1rem;
}
/* ============================================================
   notable.css — 記事・海外ニュース
   ============================================================ */

.nf { background:var(--card); border:1px solid var(--bd); border-radius:8px; overflow:hidden; margin-bottom:.55rem; }
.nf-head { display:flex; align-items:center; justify-content:space-between; padding:.45rem .78rem; border-bottom:1px solid var(--bd); }
.nf-src  { display:flex; align-items:center; gap:.35rem; }
.nf-av   { width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.62rem; font-weight:700; color:#fff; flex-shrink:0; font-family:'Barlow Condensed',sans-serif; }
.nf-name { font-size:.65rem; font-weight:600; color:var(--tx); }
.nf-handle { font-family:'Space Mono',monospace; font-size:.52rem; color:var(--tx3); }
.nf-t    { font-family:'Space Mono',monospace; font-size:.52rem; color:var(--tx3); }
.nf-body { padding:.68rem .78rem; }
.nf-orig { font-size:.65rem; color:var(--tx3); line-height:1.6; padding:.38rem .55rem; background:rgba(0,0,0,.03); border-radius:4px; border-left:2px solid rgba(255,90,0,.3); margin-bottom:.48rem; font-style:italic; }
.nf-ja   { font-size:.8rem; color:var(--tx); line-height:1.7; font-weight:500; }
.nf-tag  { font-family:'Barlow Condensed',sans-serif; font-size:.58rem; font-weight:700; padding:.1rem .38rem; border-radius:3px; display:inline-block; margin-top:.4rem; letter-spacing:.06em; }
.t-break { background:var(--or); color:#fff; }
.t-trade { background:rgba(0,112,204,.2); color:var(--cy); }
.t-inj   { background:rgba(255,59,59,.15); color:var(--rd); }
.t-stat  { background:rgba(0,212,106,.12); color:var(--gr); }
.nf-btns { display:flex; gap:.28rem; margin-top:.42rem; }
.nf-btn  { padding:.2rem .52rem; border-radius:4px; font-family:'Barlow Condensed',sans-serif; font-size:.62rem; font-weight:700; letter-spacing:.06em; border:none; cursor:pointer; }
.btn-x   { background:#111; color:#fff; }
.btn-cp  { background:rgba(0,0,0,.06); color:var(--tx2); border:1px solid var(--bd); }
/* ============================================================
   players.css — 選手一覧・詳細
   ============================================================ */

/* チームフィルターボタン */
.pf-btn {
  flex-shrink:0; padding:.28rem .72rem; border-radius:4px;
  font-family:'Barlow Condensed',sans-serif; font-size:.68rem; font-weight:700; letter-spacing:.08em;
  border:1px solid var(--bd); background:transparent; color:var(--tx3); cursor:pointer;
  text-transform:uppercase; transition:all .15s;
}
.pf-btn.on { background:var(--or); color:#fff; border-color:transparent; }

/* 選手カード */
.pl-card  { background:var(--card); border:1px solid var(--bd); border-radius:8px; overflow:hidden; cursor:pointer; margin-bottom:.45rem; transition:border-color .15s; }
.pl-card:active { border-color:var(--or); }
.pl-card.jp { border-left:3px solid var(--or); }

/* チームチャットカード */
.team-card {
  background:var(--card); border:1px solid var(--bd); border-radius:8px;
  display:flex; align-items:center; gap:.7rem;
  padding:.62rem .82rem; margin-bottom:.45rem;
  cursor:pointer; transition:border-color .15s;
}
.team-card:active { border-color:var(--or); }
.team-card.jp     { border-left:3px solid var(--or); }
.tc-logo  { width:38px; height:38px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:1.35rem; flex-shrink:0; }
.tc-info  { flex:1; min-width:0; }
.tc-name  { font-size:.78rem; font-weight:600; color:var(--tx); margin-bottom:.06rem; }
.tc-sub   { display:flex; align-items:center; gap:.35rem; }
.tc-on    { font-family:'Barlow Condensed',sans-serif; font-size:.6rem; color:var(--gr); display:flex; align-items:center; gap:.18rem; letter-spacing:.04em; }
.tc-on::before { content:''; width:4px; height:4px; border-radius:50%; background:var(--gr); }
.tc-note  { font-size:.6rem; color:var(--tx3); margin-top:.08rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tc-wl    { font-family:'Space Mono',monospace; font-size:.6rem; color:var(--tx3); flex-shrink:0; }
.tc-unreads {
  background:var(--or); color:#fff;
  font-family:'Barlow Condensed',sans-serif; font-size:.6rem; font-weight:700;
  width:18px; height:18px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
/* ============================================================
   search.css — 検索オーバーレイ
   ============================================================ */

.srch-overlay {
  position:fixed; inset:0; z-index:200;
  background:rgba(17,17,30,.65); backdrop-filter:blur(12px);
  display:none; align-items:flex-start; justify-content:center;
}
.srch-overlay.show { display:flex; animation:fadeUp .18s ease; }
.srch-box {
  width:100%; max-width:430px; background:#FFFFFF;
  border-radius:0 0 12px 12px; box-shadow:0 16px 48px rgba(0,0,0,.6);
  overflow:hidden; max-height:88vh; display:flex; flex-direction:column;
  border:1px solid var(--bd); border-top:none;
}
.si-row  { display:flex; align-items:center; gap:.46rem; padding:.72rem .9rem; border-bottom:1px solid var(--bd); }
.si-ico  { font-size:.9rem; color:var(--tx3); }
.si-inp  { flex:1; border:none; outline:none; font-size:.88rem; color:var(--tx); font-family:'Barlow',sans-serif; background:transparent; }
.si-inp::placeholder { color:var(--tx3); }
.si-close { background:rgba(0,0,0,.06); border:none; border-radius:50%; width:24px; height:24px; cursor:pointer; font-size:.7rem; color:var(--tx3); display:flex; align-items:center; justify-content:center; }
.srch-tags { display:flex; gap:.28rem; padding:.5rem .9rem; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--bd); }
.srch-tags::-webkit-scrollbar { display:none; }
.stag {
  flex-shrink:0; padding:.24rem .62rem; border-radius:4px;
  font-family:'Barlow Condensed',sans-serif; font-size:.66rem; font-weight:700; letter-spacing:.06em;
  border:1px solid var(--bd); background:transparent; color:var(--tx3); cursor:pointer;
  white-space:nowrap; text-transform:uppercase;
}
.stag:active { background:var(--or); color:#fff; border-color:transparent; }
.srch-results { flex:1; overflow-y:auto; }
.srch-empty   { text-align:center; padding:2rem 1rem; }
.sr-sec   { padding:.4rem .9rem .18rem; font-family:'Barlow Condensed',sans-serif; font-size:.6rem; font-weight:700; color:var(--tx3); letter-spacing:.14em; text-transform:uppercase; }
.sr-item  { display:flex; align-items:center; gap:.6rem; padding:.55rem .9rem; cursor:pointer; border-bottom:1px solid var(--bd); }
.sr-item:active { background:rgba(0,0,0,.03); }
.sri-ico  { width:32px; height:32px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:1rem; flex-shrink:0; background:var(--bg3); }
.sri-body { flex:1; min-width:0; }
.sri-title { font-size:.78rem; font-weight:600; color:var(--tx); margin-bottom:.08rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sri-sub   { font-family:'Barlow Condensed',sans-serif; font-size:.62rem; color:var(--tx3); letter-spacing:.04em; }
.sri-badge { font-family:'Barlow Condensed',sans-serif; font-size:.56rem; font-weight:700; padding:.1rem .36rem; border-radius:3px; flex-shrink:0; letter-spacing:.06em; }
.sbg-live  { background:rgba(255,59,59,.15); color:var(--rd); }
.sbg-news  { background:rgba(255,90,0,.15); color:var(--or); }
.sbg-pl    { background:rgba(0,200,255,.12); color:var(--cy); }
/* ============================================================
   chat.css — チームチャットページ専用スタイル
   ============================================================ */

/* ニックネームモーダル内の絵文字 */
.nick-emoji {
  font-size:1.2rem; cursor:pointer; padding:.2rem;
  border-radius:4px; background:var(--bg3);
  border:1.5px solid transparent;
}
.nick-emoji.on { border-color:var(--or); }
/* ============================================================
   ads.css — 広告ユニット
   NBA体験の中に自然に溶け込む広告スタイル
   ============================================================ */

/* ===== コンテンツ型広告（選手×商品） ===== */
.ad-unit {
  background:var(--card); border:1px solid var(--bd);
  border-radius:8px; overflow:hidden;
  margin-bottom:.6rem; position:relative; cursor:pointer;
}
.ad-unit:active { opacity:.88; }
.ad-label {
  position:absolute; top:4px; right:6px;
  font-family:'Barlow Condensed',sans-serif; font-size:.48rem;
  color:var(--tx3); letter-spacing:.06em; text-transform:uppercase; opacity:.6;
}

/* コンテンツ型（選手グッズ・バッシュなど） */
.ad-content {
  display:flex; align-items:center; gap:.75rem;
  padding:.7rem .85rem;

// ---------- 時刻 ----------

/** 現在の日本時間を "HH:MM" で返す */
function ntime() {
  return new Date().toLocaleTimeString('ja-JP', {
    hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tokyo'
  });
}

/** 日本時間の Date オブジェクトを返す */
function getJPDate() {
  return new Date(new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' }));
}

/** NBA基準日を返す（日本時間14時前は前日扱い） */
function getNBABaseDate() {
  // 日本時間で現在時刻を取得
  const nowStr = new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });
  const nowJP  = new Date(nowStr);
  const jpHour = nowJP.getHours();
  // 日本時間14時前（NBA試合がまだ前日分）は前日を返す
  if (jpHour < 14) nowJP.setDate(nowJP.getDate() - 1);
  return nowJP;
}

/** Date を "YYYYMMDD" 文字列に変換（日本時間基準） */
function toDateStr(date) {
  // 日本時間で年月日を取得
  const jp = new Date(date.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' }));
  return jp.getFullYear()
    + String(jp.getMonth() + 1).padStart(2, '0')
    + String(jp.getDate()).padStart(2, '0');
}

/** 曜日配列 */
const DAYS = ['日', '月', '火', '水', '木', '金', '土'];

/** Date を "M月D日（曜）" 形式に変換（日本時間基準） */
function toJPDateLabel(date) {
  const jp = new Date(date.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' }));
  return `${jp.getMonth() + 1}月${jp.getDate()}日（${DAYS[jp.getDay()]}）`;
}

// ---------- 文字列 ----------

/** HTML エスケープ（XSS対策） */
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/** 検索キーワードをハイライト */
function highlight(text, query) {
  if (!query) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(escaped, 'gi'), m => `<mark>${m}</mark>`);
}

/** id で要素を取得（見つからなければ null） */
const $ = (id) => document.getElementById(id);

/** セレクタで複数要素取得 */
const $$ = (sel, parent = document) => [...parent.querySelectorAll(sel)];

/** ローディング用シマーHTMLを返す */
function shimmerHTML(rows) {
  rows = rows || 3;
  return Array.from({ length: rows }, function() {
    return '<div style="height:60px;border-radius:8px;background:linear-gradient(90deg,var(--bg3) 25%,var(--bd) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;margin-bottom:.45rem;"></div>';
  }).join('');
}

// ---------- ローカルストレージ ----------

/** ローカルストレージに安全に保存 */
function lsSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch(e) {}
}

/** ローカルストレージから安全に取得（失敗時は fallback） */
function lsGet(key, fallback = null) {
  try {
    const v = localStorage.getItem(key);
    return v !== null ? JSON.parse(v) : fallback;
  } catch(e) { return fallback; }
}

// ---------- ネットワーク ----------

/** fetch のタイムアウト付きラッパー（デフォルト 8秒） */
async function fetchWithTimeout(url, options = {}, ms = 8000) {
  const controller = new AbortController();
  const tid = setTimeout(() => controller.abort(), ms);
  try {
    const res = await fetch(url, { ...options, signal: controller.signal });
    clearTimeout(tid);
    return res;
  } catch(e) {
    clearTimeout(tid);
    throw e;
  }
}

/** X（Twitter）でシェアするURLを開く */
function shareX(text) {
  const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text + '\n\nhttps://reliable-kitsune-62166e.netlify.app')}`;
  window.open(url, '_blank');
}

/** テキストをクリップボードにコピー */
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    showToast('コピーしました！');
  } catch(e) {
    showToast('コピーに失敗しました');
  }
}

// ---------- トースト通知 ----------

let _toastTimer = null;

/** 画面下部にトースト通知を表示 */
function showToast(msg, ms = 2000) {
  let el = $('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = [
      'position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px)',
      'background:#111;color:#fff;font-size:.75rem;font-weight:500',
      'padding:.55rem 1.1rem;border-radius:100px',
      'opacity:0;z-index:999;transition:all .22s;pointer-events:none',
      'white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3)',
      "font-family:'Barlow Condensed',sans-serif;letter-spacing:.06em",
    ].join(';');
    document.body.appendChild(el);
  }
  el.textContent = msg;
  clearTimeout(_toastTimer);
  requestAnimationFrame(() => {
    el.style.opacity = '1';
    el.style.transform = 'translateX(-50%) translateY(0)';
  });
  _toastTimer = setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateX(-50%) translateY(8px)';
  }, ms);
}

// ---------- 選手写真キャッシュ ----------
const _photoCache = {};

/** 選手名から ESPN 顔写真 URL を取得（キャッシュあり） */
async function getPlayerPhoto(playerName) {
  if (_photoCache[playerName] !== undefined) return _photoCache[playerName];
  try {
    const q   = encodeURIComponent(playerName);
    const res = await fetchWithTimeout(
      `${ESPN_BASE}/athletes?limit=3&search=${q}`, {}, 5000
    );
    if (!res.ok) throw new Error('no');
    const data    = await res.json();
    const athlete = (data.athletes || [])[0];
    if (!athlete) throw new Error('no');
    const url = ESPN_HEADSHOT(athlete.id);
    _photoCache[playerName] = url;
    return url;
  } catch(e) {
    _photoCache[playerName] = '';
    return '';
  }
}

      method: 'PUT',

// ============================================================
// 状態管理
// ============================================================
let dateOff = 0;
let selId   = null;

// ============================================================
// シーズンフェーズ切り替え（レギュラー/プレーイン/プレーオフ）
// ============================================================
let currentPhase = 'season';

const PHASE_LABELS = {
  season:  { label:'レギュラーシーズン', badge:'REGULAR',  badgeClass:'badge-season' },
  playin:  { label:'プレーイン',          badge:'PLAY-IN',  badgeClass:'badge-playin' },
  playoff: { label:'プレーオフ',          badge:'PLAYOFFS', badgeClass:'badge-playoff' },
};

function switchPhase(btn, phase) {
  document.querySelectorAll('#pg-schedule .conf-row .conf-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  currentPhase = phase;

  // バッジを更新
  const info   = PHASE_LABELS[phase];
  const badge  = document.getElementById('schedulePhaseLabel');
  if (badge) {
    badge.textContent  = info.badge;
    badge.className    = `pg-badge ${info.badgeClass}`;
  }

  // 日付をリセットして再取得
  dateOff = 0;
  selId   = null;
  loadESPNScoreboard();
}

// ============================================================
// 日付バー操作（前日・翌日ボタン）
// ============================================================
function moveDate(d) {
  const next = dateOff + d;
  if (next < -3 || next > 3) return;
  dateOff = next;
  selId   = null;

  const base = getNBABaseDate(); // utils.js
  const dt   = new Date(base);
  dt.setDate(dt.getDate() + dateOff);

  // 日付ラベル更新
  document.getElementById('dbDate').textContent = toJPDateLabel(dt); // utils.js
  const sub = document.getElementById('dbSub');
  if (dateOff === 0) {
    sub.innerHTML = 'TODAY<span class="db-today">今日</span>';
  } else if (dateOff < 0) {
    sub.textContent = Math.abs(dateOff) + '日前';
  } else {
    sub.textContent = dateOff + '日後';
  }

  // ESPN APIで指定日の試合を取得
  const dateStr = toDateStr(dt); // utils.js
  loadGamesForDate(dateStr);
}

// ============================================================
// 試合カード一覧を描画
// ============================================================
function renderGames() {
  const games = GAMES[String(dateOff)] || [];
  const wrap  = document.getElementById('gameWrap');
  if (!games.length) {
    wrap.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--tx3);font-size:.78rem;font-family:\'Barlow Condensed\',sans-serif;letter-spacing:.06em;">この日の試合情報はありません</div>';
    return;
  }
  wrap.innerHTML = games.map(g => `
    <div id="gc-wrap-${g.id}">
      ${gcHTML(g)}
      <div class="detail-panel" id="dp-${g.id}"></div>
    </div>`
  ).join('');

  // ライブ試合を自動選択
  const first = games.find(g => g.status === 'live') || games[0];
  if (first) selectGame(first.id);
}

// ============================================================
// 試合カード 1枚のHTML生成
// ============================================================
function gcHTML(g) {
  const isL = g.status === 'live';
  const isF = g.status === 'final';
  const isP = g.status === 'pre';
  const hl  = g.home.score > g.away.score;
  const m   = g.timeLeft ? Math.floor(g.timeLeft / 60) : 0;
  const s   = g.timeLeft ? String(g.timeLeft % 60).padStart(2, '0') : '00';
  const sel = selId === g.id;
  const clockDisp = g.clock || (m + ':' + s);

  const stHtml = isL
    ? `<span class="gc-status live">● LIVE</span>`
    : isF
    ? `<span class="gc-status fin">✓ FINAL</span>`
    : `<span class="gc-status pre">UPCOMING</span>`;

  const noteHtml = g.note ? `<span class="gc-note">▸ ${g.note}</span>` : '';

  const updHtml = isL
    ? `<span class="gc-upd" id="upd-${g.id}">--:--</span>`
    : isF
    ? `<span class="gc-upd">終了</span>`
    : `<span class="gc-upd">${g.startTime}〜</span>`;

  const midHtml = isL
    ? `<div class="gc-q">${g.q}</div><div class="gc-t" id="gt-${g.id}">${clockDisp}</div>`
    : isF
    ? `<div class="gc-end">FINAL</div>`
    : `<div class="gc-vs">VS</div><div class="gc-st">${g.startTime}</div>`;

  const ac = isL ? 'accent-live' : isF ? 'accent-fin' : 'accent-pre';

  // プレーオフ勝利数表示（currentPhaseがplayoffの場合）
  const poSeriesHome = g.poWinsHome !== undefined ? `<div style="font-family:'Barlow Condensed',sans-serif;font-size:.52rem;color:var(--or);letter-spacing:.04em;">${g.poWinsHome}勝</div>` : '';
  const poSeriesAway = g.poWinsAway !== undefined ? `<div style="font-family:'Barlow Condensed',sans-serif;font-size:.52rem;color:var(--or);letter-spacing:.04em;">${g.poWinsAway}勝</div>` : '';
  const poSeriesBadge = (g.poWinsHome !== undefined && currentPhase === 'playoff')
    ? `<div style="font-family:'Barlow Condensed',sans-serif;font-size:.6rem;font-weight:700;color:var(--go);letter-spacing:.04em;text-align:center;">${g.poWinsHome}-${g.poWinsAway} シリーズ</div>`
    : '';

  // チームロゴ（NBA公式CDN）
  const hLogoId = TEAM_CDN_IDS[g.home.abbr];
  const aLogoId = TEAM_CDN_IDS[g.away.abbr];
  const hLogo = hLogoId
    ? `<img src="${NBA_CDN_LOGO(hLogoId)}" style="width:36px;height:36px;object-fit:contain;margin-bottom:2px;" onerror="this.style.display='none';">`
    : `<span style="font-size:1.4rem;">${g.home.abbr}</span>`;
  const aLogo = aLogoId
    ? `<img src="${NBA_CDN_LOGO(aLogoId)}" style="width:36px;height:36px;object-fit:contain;margin-bottom:2px;" onerror="this.style.display='none';">`
    : `<span style="font-size:1.4rem;">${g.away.abbr}</span>`;

  return `<div class="gc${isL ? ' live' : ''}${sel ? ' selected' : ''}" id="gc-${g.id}" onclick="selectGame('${g.id}')">
    <div class="gc-accent ${ac}"></div>
    <div class="gc-head">${stHtml}${noteHtml}${updHtml}</div>
    ${poSeriesBadge ? `<div style="padding:.2rem .75rem;background:rgba(212,144,10,.08);border-bottom:1px solid rgba(212,144,10,.15);">${poSeriesBadge}</div>` : ''}
    <div class="gc-body">
      <div class="gc-team">
        <div class="gc-city">${g.home.city}</div>
        ${hLogo}
        <div class="gc-abbr">${g.home.abbr}</div>
        <div class="gc-score${hl && !isP ? ' gc-win' : ''}" id="hs-${g.id}">${isP ? '—' : g.home.score}</div>
        ${poSeriesHome}
      </div>
      <div class="gc-mid">${midHtml}</div>
      <div class="gc-team r">
        <div class="gc-city">${g.away.city}</div>
        ${aLogo}
        <div class="gc-abbr">${g.away.abbr}</div>
        <div class="gc-score${!hl && !isP ? ' gc-win' : ''}" id="as-${g.id}">${isP ? '—' : g.away.score}</div>
        ${poSeriesAway}
      </div>
    </div>
  </div>`;
}

// ============================================================
// 試合カードをタップ → 詳細パネルを開く
// ============================================================
async function selectGame(id) {
  // 同じカードをタップしたら閉じる
  if (selId === id) {
    selId = null;
    document.querySelectorAll('.gc').forEach(c => c.classList.remove('selected'));
    document.querySelectorAll('.detail-panel').forEach(p => p.classList.remove('open'));
    return;
  }
  selId = id;
  document.querySelectorAll('.gc').forEach(c => c.classList.toggle('selected', c.id === 'gc-' + id));
  document.querySelectorAll('.detail-panel').forEach(p => p.classList.remove('open'));

  const panel = document.getElementById('dp-' + id);
  if (!panel) return;
  const games = GAMES[String(dateOff)] || [];
  const g = games.find(x => x.id === id);
  if (!g) return;

  panel.innerHTML = buildDetail(g);
  panel.classList.add('open');

  // Lv5: 実況チャットを読み込む
  setTimeout(() => {
    if (document.getElementById(`lc-msgs-${id}`)) {
      loadLiveChat(id);
    }
    restoreNotifyBtns();
  }, 100);

  // ESPN APIで選手スタッツ取得
  const espnId = id.replace('espn-', '');
  if (id.startsWith('espn-')) {
    await loadESPNPlayerStats(g, espnId, panel);
  }

  // カードが見えるようにスクロール
  const card = document.getElementById('gc-' + id);
  if (card) {
    setTimeout(() => {
      document.getElementById('mainScroll').scrollTo({
        top: card.offsetTop - 52 - 40 - 8,
        behavior: 'smooth'
      });
    }, 30);
  }
}

// ============================================================
// 詳細パネルのHTML生成
// ============================================================
function buildDetail(g) {
  const isL = g.status === 'live';
  const isF = g.status === 'final';
  const isP = g.status === 'pre';
  const hl  = g.home.score > g.away.score;
  const m   = g.timeLeft ? Math.floor(g.timeLeft / 60) : 0;
  const s   = g.timeLeft ? String(g.timeLeft % 60).padStart(2, '0') : '00';
  const upd = ntime(); // utils.js
  const clockDisp = g.clock || (m + ':' + s);

  // クォータースコア行
  const ql = ['Q1','Q2','Q3','Q4'];
  let qH = ql.map((l, i) => {
    const cur = isL && i === g.qh.length - 1;
    const hv  = g.qh[i] !== undefined ? g.qh[i] : '-';
    const av  = g.qa[i] !== undefined ? g.qa[i] : '-';
    return `<div class="qi"><div class="qi-l">${l}</div><div class="qi-h${cur ? ' cur' : ''}">${hv}</div><div class="qi-a">${av}</div></div>`;
  }).join('');
  qH += `<div class="qi"><div class="qi-l">TOT</div><div class="qi-h" style="color:${hl ? 'var(--or)' : '#fff'}">${isP ? '—' : g.home.score}</div><div class="qi-a">${isP ? '—' : g.away.score}</div></div>`;

  const sBadge = isL
    ? `<div class="sbd-badge-live">● LIVE</div><div class="sbd-q">${g.q} ${clockDisp}</div>`
    : isF
    ? `<div class="sbd-badge-fin">✓ FINAL</div>`
    : `<div class="sbd-badge-pre">▸ ${g.startTime}〜</div>`;

  // 選手カード
  const rPl = (pl) => pl.map(p => {
    const oc  = p.on && isL;
    const cls = `pcrd${p.hot ? ' hot' : oc ? ' on-c' : !p.on && isL ? ' bench' : ''}`;
    const nc  = `p-nm${p.hot ? ' hc' : oc ? ' oc' : ''}`;
    const dot  = oc ? `<span class="cdot"></span>` : '';
    const fire = p.hot ? `<span class="pf">🔥</span>` : '';
    const pc   = p.pm && p.pm.startsWith('+') ? 'sv pos' : p.pm && p.pm.startsWith('-') ? 'sv neg' : 'sv';
    return `<div class="${cls}">
      <div class="p-top">
        <span class="p-num">${p.num}</span>
        <div><div class="${nc}">${dot}${p.name.split(' ').slice(-1)[0]}</div><div class="p-pos">${p.pos}</div></div>
        ${fire}
      </div>
      <div class="p-sts">
        <div><div class="${p.pts >= 20 ? 'sv hi' : 'sv'}">${p.pts}</div><div class="sl">PTS</div></div>
        <div><div class="sv">${p.ast}</div><div class="sl">AST</div></div>
        <div><div class="sv">${p.reb}</div><div class="sl">REB</div></div>
        <div><div class="${pc}">${p.pm}</div><div class="sl">±</div></div>
      </div>
    </div>`;
  }).join('');

  const statsHTML = (g.hpl && g.hpl.length)
    ? `<div class="stats-area">
        <div class="area-label">選手スタッツ${isL ? `<span class="on-legend"><span class="on-dot"></span>出場中</span>` : ''}</div>
        <div class="p2col">
          <div><div class="col-hdr col-h">${g.home.abbr}</div>${rPl(g.hpl)}</div>
          <div><div class="col-hdr col-a">${g.away.abbr}</div>${rPl(g.apl)}</div>
        </div>
      </div>`
    : isP
    ? `<div class="no-stats">試合開始後にスタッツが表示されます</div>`
    : `<div class="no-stats">📊 スタッツ取得中...</div>`;

  // Lv4 推しチーム通知バー
  const notifyHTML = `
  <div class="notify-bar" id="notify-bar-${g.id}">
    <span class="notify-bar-text">🔔 <strong>${g.home.abbr}</strong> or <strong>${g.away.abbr}</strong> の試合開始を通知で受け取る</span>
    <button class="notify-toggle-btn" id="notify-btn-${g.id}" onclick="toggleNotify('${g.home.abbr}','${g.away.abbr}',this)">通知ON</button>
  </div>`;

  // Lv5 リアルタイム実況チャット（試合前・試合中のみ）
  const chatHTML = (isP || isL) ? `
  <div class="live-chat-panel" id="lc-panel-${g.id}">
    <div class="live-chat-header">
      <div class="live-chat-dot"></div>
      実況チャット — ${g.home.abbr} vs ${g.away.abbr}
    </div>
    <div class="live-chat-msgs" id="lc-msgs-${g.id}"></div>
    <div class="live-chat-input-row">
      <input class="live-chat-input" id="lc-input-${g.id}" placeholder="今の試合について..." maxlength="60">
      <button class="live-chat-send" onclick="sendLiveChat('${g.id}',this)">送信</button>
    </div>
  </div>` : '';

  // Lv2 試合前勝敗投票UI
  const voteHTML = isP ? `
  <div class="vote-panel" id="vote-${g.id}">
    <div class="vote-title">🗳️ 今日の試合、どっちが勝つ？</div>
    <div class="vote-row">
      <button class="vote-btn vote-home" onclick="castVote('${g.id}','home','${g.home.abbr}','${g.away.abbr}',this)">${g.home.abbr}</button>
      <div class="vote-vs">VS</div>
      <button class="vote-btn vote-away" onclick="castVote('${g.id}','away','${g.home.abbr}','${g.away.abbr}',this)">${g.away.abbr}</button>
    </div>
    <div class="vote-result" id="vr-${g.id}" style="display:none">
      <div class="vote-bar-wrap">
        <div class="vote-bar-home" id="vbh-${g.id}"></div>
        <div class="vote-bar-away" id="vba-${g.id}"></div>
      </div>
      <div class="vote-pct-row">
        <span id="vpc-home-${g.id}">0%</span>
        <span id="vpc-away-${g.id}">0%</span>
      </div>
    </div>
  </div>` : '';

  return `<div class="sbd">
    <div class="sbd-glow"></div>
    <div class="sbd-head">${sBadge}<div class="sbd-upd">※${upd}時点</div></div>
    <div class="sbd-scores">
      <div class="sbt">
        <div class="sbt-city">${g.home.city}</div>
        <div class="sbt-abbr">${g.home.abbr}</div>
        <div class="sbt-score${hl && !isP ? ' ld' : ''}" id="sd-hs-${g.id}">${isP ? '—' : g.home.score}</div>
      </div>
      <div class="sbd-mid">
        <div class="sbd-sep">—</div>
        ${isL ? `<div class="sbd-clk" id="sd-t-${g.id}">${m}:${s}</div>` : ''}
      </div>
      <div class="sbt" style="text-align:right;">
        <div class="sbt-city">${g.away.city}</div>
        <div class="sbt-abbr">${g.away.abbr}</div>
        <div class="sbt-score${!hl && !isP ? ' ld' : ''}" id="sd-as-${g.id}">${isP ? '—' : g.away.score}</div>
      </div>
    </div>
    <div class="q-row">${qH}</div>
  </div>
  ${notifyHTML}
  ${voteHTML}
  ${chatHTML}
  ${statsHTML}`;
}

// ============================================================
// ESPN APIから選手スタッツを取得
// ============================================================
async function loadESPNPlayerStats(g, espnId, panel) {
  try {
    const res = await fetchWithTimeout( // utils.js
      `https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=${espnId}`
    );
    if (!res.ok) throw new Error('ESPN ' + res.status);
    const data = await res.json();

    const bp       = data.boxscore?.players || [];
    const homeData = bp.find(p => p.homeAway === 'home') || bp[1] || bp[0];
    const awayData = bp.find(p => p.homeAway === 'away') || bp[0];

    const parsePlayers = (teamData) => {
      if (!teamData?.statistics) return [];
      const seen = new Set();
      const result = [];
      for (const sg of teamData.statistics) {
        if (!sg?.athletes) continue;
        const names  = sg.names || [];
        const idx    = (label) => names.findIndex(n => (n||'').toUpperCase() === label.toUpperCase());
        const minIdx = idx('MIN'), ptsIdx = idx('PTS'), rebIdx = idx('REB'), astIdx = idx('AST');
        const stlIdx = idx('STL'), blkIdx = idx('BLK'), toIdx  = idx('TO'),  pfIdx  = idx('PF');
        const fgIdx  = idx('FG'),  fg3Idx = idx('3PT'), ftIdx  = idx('FT'),  pmIdx  = idx('+/-');

        for (const a of sg.athletes) {
          const ath = a.athlete || {};
          if (seen.has(ath.id)) continue;
          seen.add(ath.id);
          const st  = a.stats || [];
          const gN  = (i) => parseInt(st[i] || 0) || 0;
          const gS  = (i) => st[i] !== undefined ? String(st[i]) : '-';
          const pmN = parseInt(st[pmIdx] || 0) || 0;
          const sec = (() => {
            const v = st[minIdx];
            if (!v && v !== 0) return 0;
            if (typeof v === 'number') return v * 60;
            const p = String(v).split(':');
            return parseInt(p[0]||0)*60 + parseInt(p[1]||0);
          })();
          result.push({
            name: ath.displayName || '?',
            lastName: (ath.shortName || ath.displayName || '?').split(' ').slice(-1)[0],
            jerseyNum: ath.jersey || '',
            pos: (ath.position?.abbreviation || '').toUpperCase(),
            min: st[minIdx] !== undefined ? String(st[minIdx]) : '-',
            pts: gN(ptsIdx), reb: gN(rebIdx), ast: gN(astIdx),
            stl: gN(stlIdx), blk: gN(blkIdx), to: gN(toIdx), pf: gN(pfIdx),
            fg: gS(fgIdx), fg3: gS(fg3Idx), ft: gS(ftIdx),
            pm: (pmN > 0 ? '+' : '') + pmN,
            photoUrl: ath.id ? ESPN_HEADSHOT(ath.id) : '', // config.js
            starter: a.starter || false,
            didNotPlay: a.didNotPlay || false,
            _sec: sec,
          });
        }
      }
      const played = result.filter(p => !p.didNotPlay && p._sec > 0).sort((a,b) => b._sec - a._sec);
      const dnp    = result.filter(p => p.didNotPlay || p._sec === 0);
      return [...played, ...dnp];
    };

    const homePlayers = parsePlayers(homeData);
    const awayPlayers = parsePlayers(awayData);

    const renderRow = (p) => {
      const photo = p.photoUrl
        ? `<img src="${p.photoUrl}" style="width:32px;height:24px;object-fit:cover;border-radius:3px;flex-shrink:0;" onerror="this.style.display='none'">`
        : `<div style="width:32px;height:24px;border-radius:3px;background:rgba(0,0,0,.06);flex-shrink:0;"></div>`;
      if (p.didNotPlay || p._sec === 0) {
        return `<div style="display:flex;align-items:center;gap:.35rem;padding:.38rem .55rem;border-bottom:1px solid var(--bd);opacity:.38;">
          ${photo}
          <div style="flex:1;"><div style="font-size:.65rem;font-weight:600;color:var(--tx);">${p.lastName}</div><div style="font-size:.5rem;color:var(--tx3);">DNP</div></div>
        </div>`;
      }
      const cols = [
        {v:p.min, s:'color:var(--tx2);font-size:.62rem;'},
        {v:p.pts, s:p.pts>=20?'color:var(--or);font-weight:800;':'font-weight:700;'},
        {v:p.fg,  s:'font-size:.6rem;'}, {v:p.fg3, s:'font-size:.6rem;'}, {v:p.ft, s:'font-size:.6rem;'},
        {v:p.reb, s:p.reb>=10?'color:#a78bfa;font-weight:800;':'font-weight:700;'},
        {v:p.ast, s:p.ast>=10?'color:#60a5fa;font-weight:800;':'font-weight:700;'},

      const starters = players.filter(p => !p.didNotPlay && p._sec > 0 && p.starter);

        ${dnp.length      ? secHdr('DNP')        + dnp.map(renderRow).join('')      : ''}
      </div>`;
    };

    const newHTML = `<div class="stats-area">
      <div class="area-label">選手スタッツ</div>

      ${buildTable(awayPlayers, g.away.abbr, false)}

async function loadESPNScoreboard() {
  const wrap = document.getElementById('gameWrap');
  if (wrap) wrap.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--tx3);font-family:\'Barlow Condensed\',sans-serif;">🏀 試合情報を取得中...</div>';

  try {
    // 今日・前日・翌日の3日分を試す
    const jp      = getJPDate();
    const dates   = [0, -1, 1].map(offset => {
      const d = new Date(jp);
      d.setDate(d.getDate() + offset);
      return toDateStr(d);
    });

    let events = [];
    let usedDate = dates[0];

    for (const dateStr of dates) {
      const res = await fetch(`${ESPN_SCOREBOARD}?dates=${dateStr}&limit=20`);
      if (!res.ok) continue;
      const data = await res.json();
      events = data.events || [];
      if (events.length) { usedDate = dateStr; break; }
    }

    // それでも取得できない場合はプレーオフエンドポイントを試す
    if (!events.length) {
      const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?seasontype=3&limit=20`);
      if (res.ok) {
        const data = await res.json();
        events = data.events || [];
      }
    }

    if (!events.length) {
      if (wrap) wrap.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--tx3);">本日の試合はありません<br><span style="font-size:.7rem;">次の試合をお待ちください</span></div>';
      return;
    }

    GAMES['0'] = parseESPNGames(events);
    dateOff = 0;

    const dateEl = document.getElementById('dbDate');
    if (dateEl) dateEl.textContent = toJPDateLabel(jp);
    const subEl = document.getElementById('dbSub');
    if (subEl) subEl.innerHTML = 'TODAY<span class="db-today">今日</span>';

    const isFirst = !document.getElementById('gameWrap').querySelector('.gc');
    if (isFirst) {
      renderGames();
      const first = GAMES['0'].find(g => g.status === 'live') || GAMES['0'][0];
      if (first) setTimeout(() => selectGame(first.id), 200);
    } else {
      GAMES['0'].forEach(g => {
        const hs = document.getElementById('hs-' + g.id);
        const as = document.getElementById('as-' + g.id);
        if (hs) hs.textContent = g.home.score;
        if (as) as.textContent = g.away.score;
      });
    }
    console.log('✅ ESPN試合取得成功:', events.length, '試合', usedDate);

  } catch(e) {
    console.warn('ESPN失敗:', e.message, '→ ダミーデータを表示');
    renderGames();
  }
}

// ============================================================
// ESPN APIレスポンスを内部フォーマットに変換
// ============================================================
function parseESPNGames(events) {
  return events.map(ev => {
    const comp  = ev.competitions[0];
    const home  = comp.competitors.find(c => c.homeAway === 'home') || comp.competitors[0];
    const away  = comp.competitors.find(c => c.homeAway === 'away') || comp.competitors[1];
    const state = ev.status.type.state;
    const period = ev.status.period || 0;
    const clock  = ev.status.displayClock || '';
    let status   = 'pre';
    if (state === 'in')   status = 'live';
    if (state === 'post') status = 'final';
    let startTime = '--:--';
    try {
      // 日本時間で開始時刻を表示
      startTime = new Date(ev.date).toLocaleTimeString('ja-JP', {
        hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tokyo'
      });
    } catch(e) {}
    const qh   = (home.linescores || []).map(q => parseInt(q.value) || 0);
    const qa   = (away.linescores || []).map(q => parseInt(q.value) || 0);
    const note = status === 'live'  ? 'Q' + period + ' ' + clock
               : status === 'final' ? 'FINAL'
               : '🇯🇵 日本時間 ' + startTime + '〜';
    return {
      id: 'espn-' + ev.id, status, q: period > 0 ? 'Q' + period : '',
      timeLeft: 0, clock,
      home: { abbr:(home.team.abbreviation||'HOME').toUpperCase(), city:(home.team.location||'').toUpperCase(), score:parseInt(home.score)||0 },
      away: { abbr:(away.team.abbreviation||'AWAY').toUpperCase(), city:(away.team.location||'').toUpperCase(), score:parseInt(away.score)||0 },
      // プレーオフシリーズ勝利数
      poWinsHome: home.wins !== undefined ? home.wins : undefined,
      poWinsAway: away.wins !== undefined ? away.wins : undefined,
      qh, qa, note, plays:[], hpl:[], apl:[], startTime
    };
  });
}

// ============================================================
async function loadESPNLeaders(stat, mode) {
  const list    = document.getElementById('leaderList');
  const loading = document.getElementById('statsLoading');
  if (!list) return;
  list.innerHTML = '';
  if (loading) loading.style.display = 'block';

  try {
    const statInfo   = ESPN_STAT_MAP[stat] || ESPN_STAT_MAP.pts;
    const seasontype = mode === 'playoff' ? 3 : mode === 'playin' ? 5 : 2;

    // ESPN スタッツリーダーAPI
    const url = `https://site.api.espn.com/apis/site/v2/sports/basketball/nba/leaders?limit=15&season=2025&seasontype=${seasontype}`;
    const res = await fetchWithTimeout(url, {}, 8000);
    if (!res.ok) throw new Error('ESPN Stats ' + res.status);
    const data = await res.json();

    // ESPN APIのレスポンスからスタッツカテゴリを探す
    const categories = data.leaders || [];
    const category   = categories.find(c =>
      c.name === statInfo.espnStat ||
      c.abbreviation?.toLowerCase() === stat.toLowerCase()
    ) || categories[0];

    if (!category || !category.leaders) throw new Error('カテゴリなし');

    if (loading) loading.style.display = 'none';
    const medals = ['🥇','🥈','🥉'];

    list.innerHTML = category.leaders.map((entry, i) => {
      const rank    = i + 1;
      const medal   = rank <= 3 ? medals[i] : rank;
      const athlete = entry.athlete || {};
      const name    = athlete.displayName || '';
      const jaName  = JA_NAME_MAP[name] || '';
      const team    = entry.team?.abbreviation || '';
      const rawVal  = parseFloat(entry.value) || 0;
      const isTop3  = rank <= 3;

      let val = '-';
      if (statInfo.pct) {
        val = (rawVal * 100).toFixed(1) + '%';
      } else {

async function openPlayerModalByName(name, team) {
  const modal = document.getElementById('playerModal');
  const inner = document.getElementById('playerModalInner');
  if (!modal || !inner) return;
  modal.style.display = 'block';

  inner.innerHTML = `<div style="padding:2rem;text-align:center;color:var(--tx3);">📊 選手データ取得中...</div>`;

  // ESPN IDを探す
  const norm = (s) => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  let espnId  = ESPNID_MAP[name];
  if (!espnId) {
    const ln = norm(name.split(' ').slice(-1)[0]);
    for (const [key, val] of Object.entries(ESPNID_MAP)) {
      if (norm(key.split(' ').slice(-1)[0]) === ln) { espnId = val; break; }
    }
  }

  const photoUrl = espnId ? ESPN_HEADSHOT(espnId) : ''; // config.js
  renderPlayerModal(inner, name, team, photoUrl, espnId);
}

async function renderStandings() {
  const wrap = document.getElementById('standingsWrap');
  if (!wrap) return;
  wrap.innerHTML = '<div style="text-align:center;padding:1.5rem;color:var(--tx3);font-size:.75rem;">📊 順位表取得中...</div>';

  try {
    // シーズンタイプをモードに合わせる
    const seasontype = curMode === 'playoff' ? 3 : 2;
    const res = await fetchWithTimeout(
      `https://site.api.espn.com/apis/v2/sports/basketball/nba/standings?season=2025&seasontype=${seasontype}`,
      {}, 8000
    );
    if (!res.ok) throw new Error('ESPN standings ' + res.status);
    const data = await res.json();

    const groups  = data.children || [];
    const confName = curConf === 'east' ? 'Eastern' : 'Western';
    const group   = groups.find(g => (g.name || '').includes(confName)) || groups[curConf === 'east' ? 0 : 1];
    if (!group) throw new Error('グループなし');

    const standings = group.standings?.entries || [];
    if (!standings.length) throw new Error('データなし');

    let h = `<div class="sw">
      <div class="sw-head">
        <div class="sw-cn">チーム</div>
        <div class="sw-c">W</div>
        <div class="sw-c">L</div>
        <div class="sw-c">PCT</div>
        <div class="sw-c">GB</div>
      </div>`;

    standings.forEach((entry, i) => {
      const team  = entry.team || {};
      const abbr  = (team.abbreviation || '').toUpperCase();
      const stats = entry.stats || [];
      const getStat = (name) => stats.find(s => s.name === name)?.value ?? '-';
      const w    = getStat('wins');
      const l    = getStat('losses');
      const pct  = getStat('winPercent');
      const gb   = getStat('gamesBehind');
      const hw   = getStat('homeWins');
      const hl   = getStat('homeLosses');
      const aw   = getStat('awayWins');
      const al   = getStat('awayLosses');
      const rank = i + 1;

      // プレーオフ圏内判定
      const badge = rank <= 6 ? 'po' : rank <= 10 ? 'pi' : '';
      const cls   = badge === 'po' ? 'sw-row po' : badge === 'pi' ? 'sw-row pi' : 'sw-row';
      const cdnId = TEAM_CDN_IDS[abbr] || '';
      const logo  = cdnId
        ? `<img src="${NBA_CDN_LOGO(cdnId)}" style="width:22px;height:22px;object-fit:contain;" onerror="this.style.display='none'">`
        : `<span style="font-size:.9rem;">🏀</span>`;
      const pctDisp = typeof pct === 'number' ? pct.toFixed(3).replace(/^0/, '') : '-';
      const gbDisp  = gb === 0 ? '-' : (typeof gb === 'number' ? gb.toFixed(1) : gb);

      // ホーム/アウェイ成績をサブテキストで表示
      const recordSub = (hw !== '-' && aw !== '-')
        ? `<div style="font-size:.44rem;color:var(--tx3);">H:${hw}-${hl} A:${aw}-${al}</div>` : '';

      h += `<div class="${cls}">
        <div class="sw-rk">${rank}</div>
        <div class="sw-tm">
          <div class="sw-logo">${logo}</div>
          <div>
            <div class="sw-abbr">${abbr}${badge ? ` <span class="sw-badge b${badge}">${badge.toUpperCase()}</span>` : ''}</div>
            ${recordSub}
          </div>
        </div>
        <div class="sw-n hi">${w}</div>
        <div class="sw-n">${l}</div>
        <div class="sw-n">${pctDisp}</div>
        <div class="sw-n">${gbDisp}</div>
      </div>`;
      if (i === 5) h += `<div class="sw-div1"></div>`;
      if (i === 9) h += `<div class="sw-div2"></div>`;
    });

    h += '</div>';
    wrap.innerHTML = h;
    console.log('✅ ESPN順位表取得成功');

  } catch(e) {
    console.warn('ESPN順位表失敗、ダミーデータ:', e.message);
    _renderDummyStandings();
  }
}

// RSS2JSONを使ってCORSを回避
const RSS2JSON = 'https://api.rss2json.com/v1/api.json?rss_url=';

let _allArticles = [];
let articleFilter = 'all';

// ============================================================
// 記事ページを初期化
// ============================================================
async function initNotable() {
  const list    = document.getElementById('articleList');
  const loading = document.getElementById('articleLoading');
  if (loading) loading.style.display = 'block';
  if (list)    list.innerHTML = '';

  const RSS2JSON = 'https://api.rss2json.com/v1/api.json?count=8&rss_url=';

  try {
    const results = await Promise.all(
      NEWS_FEEDS.map(async feed => {
        try {
          const res  = await fetchWithTimeout(
            `${RSS2JSON}${encodeURIComponent(feed.url)}`, {}, 8000
          );
          if (!res.ok) return [];
          const data = await res.json();
          if (data.status !== 'ok') return [];
          return (data.items || []).map(item => ({
            title:   item.title   || '',
            link:    item.link    || '',
            pubDate: item.pubDate || '',
            desc:    (item.description || '').replace(/<[^>]*>/g,'').slice(0,150),
            name:    feed.name,
            color:   feed.color,
            av:      feed.av,
          }));
        } catch(e) { return []; }
      })
    );

    _allArticles = results.flat().sort((a, b) =>
      new Date(b.pubDate) - new Date(a.pubDate)
    );

    if (loading) loading.style.display = 'none';
    if (!_allArticles.length) throw new Error('記事なし');
    renderArticles(_allArticles);
    console.log('✅ ニュース取得成功:', _allArticles.length, '件');

  } catch(e) {
    console.warn('ニュース取得失敗:', e.message);
    if (loading) loading.style.display = 'none';
    if (list) list.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--tx3);font-size:.78rem;">ニュースの取得に失敗しました。<br>しばらくしてから再度お試しください。</div>';
  }
}

// ============================================================
// 時刻を「○分前」「○時間前」に変換
// ============================================================
function timeAgo(pubDate) {
  if (!pubDate) return '';
  const diff = Date.now() - new Date(pubDate).getTime();
  const m = Math.floor(diff / 60000);
  const h = Math.floor(m / 60);
  const d = Math.floor(h / 24);
  if (d > 6)  return new Date(pubDate).toLocaleDateString('ja-JP', {month:'numeric', day:'numeric'});
  if (d > 0)  return d + '日前';
  if (h > 0)  return h + '時間前';
  if (m > 0)  return m + '分前';
  return 'たった今';
}

function filterArticles(media) {
  articleFilter = media;

  document.querySelectorAll('.media-filter-btn').forEach(btn => {

  const activeBtn = document.getElementById('media-btn-' + media);
  if (activeBtn) activeBtn.classList.add('active-media');

  const filtered = media === 'all'
    ? _allArticles
    : _allArticles.filter(a => a.name.toLowerCase().includes(media));

  renderArticles(filtered);
}

let teamConf  = 'east';

// ============================================================
// チーム一覧を描画
// ============================================================
function filterConf(btn, conf) {
  document.querySelectorAll('#pg-teams .conf-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  teamConf = conf;
  renderTeams();
}

function renderTeams() {
  const filtered = TEAMS.filter(t => teamConf === 'all' || t.conf === teamConf);
  // 全体オンライン数からチームごとの人数を比例配分
  const total = _globalOnlineCount || 12;
  document.getElementById('teamList').innerHTML = filtered.map((t, i) => {
    const cdnId   = TEAM_CDN_IDS[t.abbr] || '';
    const logoHtml = cdnId
      ? `<img src="${NBA_CDN_LOGO(cdnId)}" style="width:34px;height:34px;object-fit:contain;" onerror="this.outerHTML='<span style=\\'font-size:1.3rem;\\'>${t.logo}</span>'">`
      : `<span style="font-size:1.3rem;">${t.logo}</span>`;
    const lastMsg = t.msgs[t.msgs.length - 1];
    const preview = lastMsg ? lastMsg.msg.slice(0, 28) + '…' : 'まだ投稿がありません';
    // チームごとのオンライン数 = 全体の5〜15%をランダムに分配（合計が全体を超えない）
    const teamOnline = Math.max(1, Math.floor(total * (0.05 + Math.random() * 0.1)));
    const unread  = i < 3 ? Math.floor(Math.random() * 8) + 1 : 0;
    return `<div class="team-card${t.jp ? ' jp' : ''}" onclick="openChatFull('${t.id}')">
      <div class="tc-logo">${logoHtml}</div>
      <div class="tc-info">
        <div class="tc-name">${t.abbr}${t.jp ? ' 🇯🇵' : ''}</div>
        <div class="tc-sub"><span class="tc-on">${teamOnline}人オンライン</span></div>
        <div class="tc-note">${preview}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:.3rem;flex-shrink:0;">
        <div class="tc-wl">${t.w}-${t.l}</div>
        ${unread ? `<div class="tc-unreads">${unread}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

// ============================================================
// チャットルームを開く
// ============================================================
function openChatFull(teamId) {
  if (!userNick) {
    showNickModal(teamId);
    return;
  }
  _launchChat(teamId);
}

function _launchChat(teamId) {
  cfpTeamId = teamId;
  const t   = TEAMS.find(x => x.id === teamId);
  if (!t) return;

  // チャット画面を表示
  const cfp = document.getElementById('chatFullPage');
  cfp.style.display = 'flex';
  document.getElementById('mainScroll').style.overflow = 'hidden';

  // ヘッダー設定
  const cdnId    = TEAM_CDN_IDS[t.abbr] || '';
  const logoImg  = document.getElementById('cfpLogo');
  const logoEmoji = document.getElementById('cfpLogoEmoji');
  if (cdnId) {
    logoImg.src           = NBA_CDN_LOGO(cdnId);
    logoImg.style.display = 'block';
    logoEmoji.textContent = '';
  } else {
    logoImg.style.display = 'none';
    logoEmoji.textContent = t.logo;
  }
  document.getElementById('cfpName').textContent    = t.name;
  document.getElementById('cfpOnline').textContent  = t.online + '人オンライン';
  document.getElementById('cfpField').placeholder   = t.abbr + 'について投稿...';

  // 広告設定
  const ad = TEAM_ADS[teamId] || TEAM_ADS.default;
  document.getElementById('cfpAdImg').textContent   = ad.img;
  document.getElementById('cfpAdTag').textContent   = ad.tag;
  document.getElementById('cfpAdTitle').textContent = ad.title;
  document.getElementById('cfpAdOld').textContent   = ad.old;
  document.getElementById('cfpAdPrice').textContent = ad.price;
  document.getElementById('cfpAdBtn').onclick        = () => window.open(ad.url, '_blank');
  document.getElementById('cfpAd').style.display    = 'block';

  // メッセージ描画
  renderCfpMsgs(t.msgs);

  // Firebaseポーリング開始
  startChatPoll(teamId);
}

// ============================================================
// チャットメッセージを描画
// ============================================================
function renderCfpMsgs(msgs) {
  const container = document.getElementById('cfpMsgs');
  const sysHtml   = `<div class="sys-msg">🔒 このチャットは公開されています。礼儀正しく投稿しましょう。</div>`;
  container.innerHTML = sysHtml + msgs.map((m, i) => {
    const adInsert = (i === 3 && msgs.length > 4) ? getChatAdHTML() : '';
    const isMine   = m.n === userNick;
    const colors   = ['cao','cat','cap','cag','can'];
    const avColor  = m.adm ? 'cam' : colors[Math.abs(hashStr(m.n)) % 5];
    return adInsert + `<div class="cm${isMine ? ' me' : ''}">
      <div class="cav ${avColor}">${m.n[0].toUpperCase()}</div>
      <div class="cbody">
        <div class="cname">${escapeHtml(m.n)}${m.adm ? '<span class="cadm">管理人</span>' : ''}</div>
        <div class="cbbl">${escapeHtml(m.msg)}</div>
        <div class="ctime">${m.t}</div>
      </div>
    </div>`;
  }).join('');
  setTimeout(() => { container.scrollTop = container.scrollHeight; }, 50);
}
