// ============================================================
// メッセージ送信
// ============================================================
function cfpSend() {
  const inp = document.getElementById('cfpField');
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = '';

  const t = TEAMS.find(x => x.id === cfpTeamId);
  if (!t) return;

  const now    = ntime(); // utils.js
  const newMsg = { n: userNick, msg: txt, t: now };
  t.msgs.push(newMsg);
  renderCfpMsgs(t.msgs);

  // Firebase に書き込み
  fetch(`${FB_URL}/chats/${cfpTeamId}.json`, {
    method: 'POST',
    body: JSON.stringify({ nick: userNick, emoji: userEmoji, msg: txt, t: now, ts: Date.now() })
  }).catch(() => {});

  inp.focus();
}

// リアクション送信
function cfpReact(emoji) {
  const t = TEAMS.find(x => x.id === cfpTeamId);
  if (!t) return;
  const now    = ntime();
  const newMsg = { n: userNick, msg: emoji, t: now };
  t.msgs.push(newMsg);
  renderCfpMsgs(t.msgs);
  fetch(`${FB_URL}/chats/${cfpTeamId}.json`, {
    method: 'POST',
    body: JSON.stringify({ nick: userNick, emoji: userEmoji, msg: emoji, t: now, ts: Date.now() })
  }).catch(() => {});
}

// ============================================================
// チャットルームを閉じる
// ============================================================
function closeChatFull() {
  document.getElementById('chatFullPage').style.display = 'none';
  document.getElementById('mainScroll').style.overflow  = '';
  if (cfpPollId) { clearInterval(cfpPollId); cfpPollId = null; }
  cfpTeamId = null;
}

// ============================================================
// Firebaseポーリング（5秒ごとに他ユーザーの投稿を取得）
// ============================================================
function startChatPoll(teamId) {
  if (cfpPollId) clearInterval(cfpPollId);
  let lastTs = Date.now() - 60000;

  cfpPollId = setInterval(async () => {
    try {
      const res = await fetch(`${FB_URL}/chats/${teamId}.json?orderBy="ts"&startAt=${lastTs}&limitToLast=20`);
      if (!res.ok) return;
      const data = await res.json();
      if (!data) return;
      const t = TEAMS.find(x => x.id === teamId);
      if (!t) return;
      let updated = false;
      Object.values(data).sort((a,b) => (a.ts||0) - (b.ts||0)).forEach(m => {
        if (!m || m.ts <= lastTs || m.nick === userNick) return;
        t.msgs.push({ n: m.nick, msg: escapeHtml(m.msg), t: m.t });
        lastTs  = Math.max(lastTs, m.ts);
        updated = true;
      });
      if (updated) renderCfpMsgs(t.msgs);
    } catch(e) {}
  }, CHAT_POLL_MS); // config.js で定義
}

const NICK_EMOJIS = ['🏀','👑','🔥','⚡','🎯','💪','🦁','🐺','🦅','🐉','🌟','💯','🎮','😤','🤯'];

function showNickModal(pendingTeamId) {
  const modal = document.getElementById('nickModal');
  modal.style.display   = 'flex';
  modal.dataset.pending = pendingTeamId || '';
  document.getElementById('nickEmojis').innerHTML = NICK_EMOJIS.map(e =>
    `<span class="nick-emoji${e === userEmoji ? ' on' : ''}" onclick="selectEmoji(this,'${e}')">${e}</span>`
  ).join('');
  document.getElementById('nickInp').value = '';
}

function selectEmoji(el, emoji) {
  document.querySelectorAll('.nick-emoji').forEach(e => e.classList.remove('on'));
  el.classList.add('on');
  userEmoji = emoji;
}

function saveNick(anon = false) {
  if (anon) {
    userNick  = '匿名ファン' + Math.floor(Math.random() * 9000 + 1000);
    userEmoji = '🏀';
  } else {
    const v = document.getElementById('nickInp').value.trim();
    if (!v) { document.getElementById('nickInp').focus(); return; }
    userNick = v.slice(0, 16);
  }
  lsSet('mentality_nick',  userNick);
  lsSet('mentality_emoji', userEmoji);
  const pending = document.getElementById('nickModal').dataset.pending;
  document.getElementById('nickModal').style.display = 'none';
  if (pending) _launchChat(pending);
}

// ============================================================
// 共通ユーティリティ（chat.js ローカル）
// ============================================================
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

// NBA公式CDN URL取得
function getHeadshotUrl(playerId) {
  return 'https://cdn.nba.com/headshots/nba/latest/1040x760/' + playerId + '.png';
}

// 失敗時のイニシャルアバター (HTML文字列)
function getInitialsAvatar(name, size) {
  size = size || 44;
  var parts = name.split(' ');
  var init = (parts.length >= 2 ? parts[0][0] + parts[parts.length-1][0] : name.slice(0,2)).toUpperCase();
  var fs2 = Math.round(size * 0.35);
  return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:'+fs2+'px;flex-shrink:0;">'+init+'</div>';
}

// 顔写真 img タグHTML (失敗時イニシャル表示)
// ※ onerror内でシングルクォートを使い、ダブルクォートは data属性経由で回避
function getHeadshotHTML(playerId, name, width, height, radius) {
  width = width || 44; height = height || 44; radius = radius || '6px';
  var url = getHeadshotUrl(playerId);
  var size = Math.min(width, height);
  var parts = name.split(' ');
  var init = (parts.length >= 2 ? parts[0][0] + parts[parts.length-1][0] : name.slice(0,2)).toUpperCase();
  var fs2 = Math.round(size * 0.35);
  var style = 'width:'+size+'px;height:'+size+'px;border-radius:50%;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:'+fs2+'px;';
  // onerror: ダブルクォート属性の中でシングルクォートを使う（バックスラッシュ不要）
  return '<div style="width:'+width+'px;height:'+height+'px;border-radius:'+radius+';overflow:hidden;flex-shrink:0;background:var(--bg3);">'
    + '<img src="'+url+'" data-init="'+init+'" data-sty="'+style+'"'
    + ' style="width:100%;height:100%;object-fit:cover;"'
    + ' onerror="(function(img){var d=document.createElement(img.dataset.tag);d.textContent=img.dataset.init;d.setAttribute(img.dataset.attr,img.dataset.sty);img.parentNode.replaceChild(d,img);})(this)"'
    + ' data-tag="div" data-attr="style">'
    + '</div>';
}

// ============================================================
// スタッツ取得関数群 (分離設計)
// 使用API: balldontlie v1 (無料・APIキー不要)
// 将来 Supabase 等に差し替える場合はこのブロックのみ変更する
// ============================================================
var BDL_BASE = 'https://www.balldontlie.io/api/v1';

// balldontlieのプレイヤーIDを名前検索で取得
async function bdlFindPlayerId(firstName, lastName) {
  try {
    var res = await fetch(BDL_BASE + '/players?search=' + encodeURIComponent(lastName) + '&per_page=5');
    var data = await res.json();
    var match = (data.data || []).find(function(p) {
      return p.first_name.toLowerCase() === firstName.toLowerCase()
          && p.last_name.toLowerCase()  === lastName.toLowerCase();
    });
    return match ? match.id : null;
  } catch(e) { return null; }
}

// シーズン平均スタッツを取得 (2024 = 2024-25シーズン)
async function bdlGetSeasonAvg(bdlId) {
  if (!bdlId) return null;
  try {
    var res = await fetch(BDL_BASE + '/season_averages?season=2024&player_ids[]=' + bdlId);
    var data = await res.json();
    return data.data && data.data[0] ? data.data[0] : null;
  } catch(e) { return null; }
}

// playerKey から スタッツを取得するメイン関数
async function fetchPlayerStats(playerKey) {
  var master = PLAYER_MASTER.find(function(p) { return p.key === playerKey; });
  if (!master) return null;
  var parts = master.en.split(' ');
  var bdlId = await bdlFindPlayerId(parts[0], parts.slice(1).join(' '));
  return await bdlGetSeasonAvg(bdlId);
}

// ============================================================
// ESPN APIから選手データを取得
// ============================================================
// ============================================================
// 選手一覧: APIからデータ取得して描画
// ダミースタッツは表示しない。失敗時は「取得できませんでした」
// ============================================================
async function loadPlayersFromAPI() {
  var grid = document.getElementById('playerGrid');
  if (!grid) return;

  // 取得中表示（ダミー値は出さない）
  grid.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--tx3);font-size:.75rem;">📊 選手データ取得中...</div>';

  try {
    var url = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/leaders?limit=50&season=2025&seasontype=2';
    var res = await fetchWithTimeout(url, {}, 8000);
    if (!res.ok) throw new Error('ESPN ' + res.status);
    var data = await res.json();

    var categories = data.leaders || [];
    var ptsCat = categories.find(function(c) { return c.name === 'pointsPerGame' || c.abbreviation === 'PPG'; }) || categories[0];
    if (!ptsCat || !ptsCat.leaders || !ptsCat.leaders.length) throw new Error('データなし');

    // 選手名でPLAYER_MASTERと突合 → playerId付与
    var apiPlayers = ptsCat.leaders.map(function(entry) {
      var enName = (entry.athlete && entry.athlete.displayName) || '';
      var master = PLAYER_MASTER.find(function(p) { return p.en === enName; });
      return {
        enName: enName,
        playerId: master ? master.playerId : null,
        key: master ? master.key : null,
        team: (entry.team && entry.team.abbreviation) || '',
        pts: parseFloat(entry.value) || 0,
        reb: null,
        ast: null,
      };
    });

    // REB・AST補完
    var rebCat = categories.find(function(c) { return c.name === 'reboundsPerGame' || c.abbreviation === 'RPG'; });
    var astCat = categories.find(function(c) { return c.name === 'assistsPerGame'  || c.abbreviation === 'APG'; });
    if (rebCat && rebCat.leaders) rebCat.leaders.forEach(function(e) {
      var p = apiPlayers.find(function(x) { return x.enName === (e.athlete && e.athlete.displayName); });
      if (p) p.reb = parseFloat(e.value) || 0;
    });
    if (astCat && astCat.leaders) astCat.leaders.forEach(function(e) {
      var p = apiPlayers.find(function(x) { return x.enName === (e.athlete && e.athlete.displayName); });
      if (p) p.ast = parseFloat(e.value) || 0;
    });

    window._cachedPlayers = apiPlayers;
    renderPlayerCards(apiPlayers);
    console.log('選手データ取得成功:', apiPlayers.length, '人');

  } catch(e) {
    console.warn('選手APIエラー:', e.message);
    // PLAYER_MASTERで名前のみ表示・スタッツは「準備中」
    window._cachedPlayers = PLAYER_MASTER.map(function(p) {
      return { enName:p.en, playerId:p.playerId, key:p.key, team:p.team, pts:null, reb:null, ast:null };
    });
    renderPlayerCards(window._cachedPlayers);
  }
}

// ============================================================
// 選手カード描画 (playerId → NBA公式CDN顔写真)
// スタッツ null → "-" 表示（ダミー値なし）
// ============================================================
function renderPlayerCards(players) {
  var grid = document.getElementById('playerGrid');
  if (!grid) return;
  var q = pSearch.toLowerCase();

  var list = (pTeam !== 'all') ? players.filter(function(p) { return p.team === pTeam; }) : players;
  var filtered = list.filter(function(p) {
    var en = (p.enName || '').toLowerCase();
    var ja = (JA_NAME_MAP[p.enName] || '').toLowerCase();
    return !q || en.includes(q) || ja.includes(q);
  });

  if (!filtered.length) {
    grid.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--tx3);font-size:.75rem;">選手が見つかりませんでした</div>';
    return;
  }

  grid.innerHTML = filtered.map(function(p) {
    var en   = p.enName || '';
    var ja   = JA_NAME_MAP[en] || en;
    var isJP = en === 'Yuki Kawamura' || en === 'Rui Hachimura';
    var pts  = p.pts != null ? Number(p.pts).toFixed(1) : '-';
    var reb  = p.reb != null ? Number(p.reb).toFixed(1) : '-';
    var ast  = p.ast != null ? Number(p.ast).toFixed(1) : '-';
    var ptsColor = pts !== '-' ? 'var(--or)' : 'var(--tx3)';
    var border   = isJP ? 'rgba(255,90,0,.3)' : 'var(--bd)';

    // 顔写真: playerId → NBA公式CDN、なければイニシャル
    var photo = p.playerId ? getHeadshotHTML(p.playerId, en, 44, 44, '6px') : getInitialsAvatar(en, 44);

    var nameEsc = en.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    return '<div onclick="openPlayerDetail('' + nameEsc + '','' + (p.team||'') + '','' + (p.playerId||'') + '')"'
      + ' style="background:var(--card);border:1px solid ' + border + ';border-radius:8px;padding:.55rem .7rem;display:flex;align-items:center;gap:.6rem;cursor:pointer;">'
      + photo
      + '<div style="flex:1;min-width:0;">'
      + '<div style="font-size:.78rem;font-weight:700;color:var(--tx);margin-bottom:.06rem;">' + ja + (isJP ? ' 🇯🇵' : '') + '</div>'
      + '<div style="font-family:Barlow Condensed,sans-serif;font-size:.62rem;color:var(--tx3);letter-spacing:.04em;">' + en + '</div>'
      + '<div style="font-family:Barlow Condensed,sans-serif;font-size:.58rem;color:var(--tx3);">' + (p.team||'') + '</div>'
      + '</div>'
      + '<div style="display:flex;gap:.6rem;text-align:center;flex-shrink:0;">'
      + '<div><div style="font-size:.75rem;font-weight:700;color:' + ptsColor + ';">' + pts + '</div><div style="font-size:.42rem;color:var(--tx3);">PTS</div></div>'
      + '<div><div style="font-size:.75rem;font-weight:700;color:var(--tx);">' + reb + '</div><div style="font-size:.42rem;color:var(--tx3);">REB</div></div>'
      + '<div><div style="font-size:.75rem;font-weight:700;color:var(--tx);">' + ast + '</div><div style="font-size:.42rem;color:var(--tx3);">AST</div></div>'
      + '</div>'
      + '<div style="color:var(--tx3);font-size:.7rem;">›</div>'
      + '</div>';
  }).join('');
}

// ============================================================
// 選手詳細モーダルを開く
// ============================================================
async function openPlayerDetail(name, team) {
  const modal   = document.getElementById('playerDetailModal');
  const content = document.getElementById('playerDetailContent');
  if (!modal || !content) return;
  modal.style.display = 'block';

  const jaName = JA_NAME_MAP[name] || name; // config.js
  const norm   = (s) => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  let espnId   = ESPNID_MAP[name];
  if (!espnId) {
    const ln = norm(name.split(' ').slice(-1)[0]);
    for (const [key, val] of Object.entries(ESPNID_MAP)) {
      if (norm(key.split(' ').slice(-1)[0]) === ln) { espnId = val; break; }
    }
  }
  const photoUrl = espnId ? ESPN_HEADSHOT(espnId) : ''; // config.js

  content.innerHTML = `
    <div style="background:linear-gradient(135deg,#0a1628,#1d428a);padding:1rem;position:sticky;top:0;z-index:10;">
      <button onclick="closePlayerDetail()" style="position:absolute;top:.6rem;right:.6rem;background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:.8rem;cursor:pointer;">✕</button>
      <div style="display:flex;gap:.8rem;align-items:flex-end;">
        <div style="width:80px;height:64px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.1);flex-shrink:0;">
          ${photoUrl ? `<img src="${photoUrl}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">` : ''}
        </div>
        <div>
          <div style="font-size:.65rem;color:rgba(255,255,255,.6);">${jaName}</div>
          <div style="font-size:1.2rem;font-weight:700;color:#fff;line-height:1.2;">${name}</div>
          <div style="font-size:.62rem;color:rgba(255,255,255,.5);margin-top:.2rem;">${team}</div>
        </div>
      </div>
    </div>
    <div id="playerDetailBody" style="padding:.85rem;">
      <div style="text-align:center;padding:2rem;color:var(--tx3);font-size:.75rem;">📊 データ取得中...</div>
    </div>`;

  try {
    const seasons = ['2026','2025','2024'];
    const results = await Promise.all(seasons.map(async yr => {
      const r = await fetchWithTimeout(
        `https://api.server.nbaapi.com/api/playertotals?page=1&pageSize=500&sortBy=points&ascending=false&season=${yr}&isPlayoff=false`,
        {}, 6000
      );
      if (!r.ok) return null;
      const d = await r.json();
      return (d.data || []).find(p => p.playerName === name) || null;
    }));

    const cur = results[0];
    if (!cur) throw new Error('データなし');
    const g   = cur.games || 1;
    const fmt = (v) => v !== undefined ? (v / g).toFixed(1) : '-';
    const pct = (v) => v !== undefined ? (v * 100).toFixed(1) + '%' : '-';

async function castVote(gameId, side, homeAbbr, awayAbbr, btn) {
  const voteKey = `vote_${gameId}`;
  if (localStorage.getItem(voteKey)) return; // 投票済みチェック

  localStorage.setItem(voteKey, side);

  // Firebaseに票を追加
  try {
    const url = `${FB_URL}/votes/${gameId}/${side}.json`;
    const res  = await fetch(url);
    const cur  = (await res.json()) || 0;
    await fetch(url, { method: 'PUT', body: JSON.stringify(cur + 1) });
  } catch(e) {}

  // UI更新
  btn.closest('.vote-row').querySelectorAll('.vote-btn').forEach(b => {
    b.disabled = true;
    b.classList.remove('voted-pick');
  });
  btn.classList.add('voted-pick');
  showVoteResult(gameId);
}

async function showVoteResult(gameId) {
  const panel = document.getElementById(`vr-${gameId}`);
  if (!panel) return;
  try {
    const res  = await fetch(`${FB_URL}/votes/${gameId}.json`);
    const data = (await res.json()) || {};
    const h = data.home || 0;
    const a = data.away || 0;
    const total = h + a || 1;
    const hp = Math.round(h / total * 100);
    const ap = 100 - hp;
    document.getElementById(`vbh-${gameId}`).style.width = hp + '%';
    document.getElementById(`vba-${gameId}`).style.width = ap + '%';
    document.getElementById(`vpc-home-${gameId}`).textContent = hp + '%';
    document.getElementById(`vpc-away-${gameId}`).textContent = ap + '%';
    panel.style.display = 'block';
  } catch(e) {}
}

async function sendJpComment(player) {
  const input = document.getElementById(`cinput-${player}`);
  const text  = input.value.trim();
  if (!text) return;
  input.value = '';

  const nick = localStorage.getItem('nick') || 'ゲスト';
  const comment = { text, nick, ts: Date.now() };

  // Firebaseに保存
  try {
    await fetch(`${FB_URL}/jp_comments/${player}.json`, {
      method: 'POST',
      body: JSON.stringify(comment)
    });
  } catch(e) {}

  // 即座にUI反映
  appendJpComment(player, comment);
}

function appendJpComment(player, comment) {
  const list = document.getElementById(`comments-${player}`);
  if (!list) return;
  const div = document.createElement('div');
  div.className = 'jp-comment-item';
  div.textContent = `${comment.nick}：${comment.text}`;
  list.appendChild(div);
  // 最大5件表示
  while (list.children.length > 5) list.removeChild(list.firstChild);
}

const MVP_PLAYERS = ['kawamura', 'hachimura'];

// 今週のキー（月曜起点）
function getMvpWeekKey() {
  const now = new Date();
  const day = now.getDay(); // 0=日
  const diff = (day === 0 ? -6 : 1 - day);
  const monday = new Date(now);
  monday.setDate(now.getDate() + diff);
  return `mvp_${monday.getFullYear()}_${monday.getMonth()+1}_${monday.getDate()}`;
}

async function votePlayer(player) {
  const weekKey = getMvpWeekKey();
  const storageKey = `${weekKey}_voted`;
  if (localStorage.getItem(storageKey)) {
    alert('今週はすでに投票済みです！');
    return;
  }
  localStorage.setItem(storageKey, player);

  // Firebaseに保存
  try {
    const url = `${FB_URL}/${weekKey}/${player}.json`;
    const res  = await fetch(url);
    const cur  = (await res.json()) || 0;
    await fetch(url, { method: 'PUT', body: JSON.stringify(cur + 1) });
  } catch(e) {}

  // ボタン更新
  document.getElementById(`btn-${player}`).classList.add('voted');
  document.getElementById(`btn-${player}`).textContent = '✓ 投票済み';
  MVP_PLAYERS.forEach(p => {
    const b = document.getElementById(`btn-${p}`);
    if (b) b.disabled = true;
  });

  await loadMvpVotes();
}

async function loadMvpVotes() {
  const weekKey = getMvpWeekKey();
  try {
    const res  = await fetch(`${FB_URL}/${weekKey}.json`);
    const data = (await res.json()) || {};
    const totals = MVP_PLAYERS.map(p => data[p] || 0);
    const total  = totals.reduce((a, b) => a + b, 0) || 1;

    MVP_PLAYERS.forEach((p, i) => {
      const pct = Math.round(totals[i] / total * 100);
      const cnt = document.getElementById(`cnt-${p}`);
      const bar = document.getElementById(`bar-${p}`);
      if (cnt) cnt.textContent = `${totals[i]}票`;
      if (bar) bar.style.width = pct + '%';
    });

    // 投票済みならボタン状態を復元
    const voted = localStorage.getItem(getMvpWeekKey() + '_voted');
    if (voted) {
      MVP_PLAYERS.forEach(p => {
        const b = document.getElementById(`btn-${p}`);
        if (!b) return;
        b.disabled = true;
        if (p === voted) { b.classList.add('voted'); b.textContent = '✓ 投票済み'; }
      });
    }
  } catch(e) {}
}

// ============================================================
// Lv4: 推しチーム通知機能 (Web Push)
// ============================================================
function toggleNotify(homeAbbr, awayAbbr, btn) {
  const teams = [homeAbbr, awayAbbr];
  const notifiedTeams = JSON.parse(localStorage.getItem('notifyTeams') || '[]');
  const alreadyOn = teams.some(t => notifiedTeams.includes(t));

  if (alreadyOn) {
    // 通知OFF
    const updated = notifiedTeams.filter(t => !teams.includes(t));
    localStorage.setItem('notifyTeams', JSON.stringify(updated));
    btn.textContent = '通知ON';
    btn.classList.remove('on');
    btn.classList.add('off');
    return;
  }

  // 通知許可をリクエスト
  if (!('Notification' in window)) {
    alert('このブラウザはプッシュ通知に対応していません');
    return;
  }

  Notification.requestPermission().then(perm => {
    if (perm === 'granted') {
      const updated = [...new Set([...notifiedTeams, ...teams])];
      localStorage.setItem('notifyTeams', JSON.stringify(updated));
      btn.textContent = '通知ON ✓';
      btn.classList.add('on');
      btn.classList.remove('off');
      // 確認通知を表示
      new Notification('MENTALITY 通知設定完了 🏀', {
        body: `${homeAbbr} と ${awayAbbr} の試合開始をお知らせします`,
        icon: '/favicon.ico'
      });
    } else {
      alert('通知の許可が必要です。ブラウザの設定から許可してください。');
    }
  });
}

// 通知ボタンの状態を復元
function restoreNotifyBtns() {
  const notifiedTeams = JSON.parse(localStorage.getItem('notifyTeams') || '[]');
  document.querySelectorAll('[id^="notify-btn-"]').forEach(btn => {
    const bar = btn.closest('.notify-bar');
    if (!bar) return;
    const text = bar.querySelector('.notify-bar-text').textContent;
    const match = text.match(/([A-Z]{2,3}) or ([A-Z]{2,3})/);
    if (match && (notifiedTeams.includes(match[1]) || notifiedTeams.includes(match[2]))) {
      btn.textContent = '通知ON ✓';
      btn.classList.add('on');
    }
  });
}

function appendLiveChatMsg(gameId, msg) {
  const container = document.getElementById(`lc-msgs-${gameId}`);
  if (!container) return;
  const div = document.createElement('div');
  div.className = 'live-chat-msg';
  const time = new Date(msg.ts).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
  div.innerHTML = `<span class="lc-nick">${msg.nick}</span>${msg.text} <span style="font-size:.6rem;color:var(--tx3);">${time}</span>`;
  container.appendChild(div);
  // 最大30件
  while (container.children.length > 30) container.removeChild(container.firstChild);
  container.scrollTop = container.scrollHeight;
}

async function loadLiveChat(gameId) {
  try {
    const res  = await fetch(`${FB_URL}/live_chat/${gameId}.json?orderBy="ts"&limitToLast=20`);
    const data = await res.json();
    if (!data) return;
    Object.values(data)
      .sort((a, b) => a.ts - b.ts)
      .forEach(m => appendLiveChatMsg(gameId, m));
  } catch(e) {}
}

// ============================================================
// Lv6: ESPN RSS 日本語速報
// ============================================================
const RSS_SOURCES = [
  { name: 'Yahoo Sports', url: 'https://sports.yahoo.com/nba/rss.xml' },
  { name: 'The Guardian', url: 'https://www.theguardian.com/sport/nba/rss' },
  { name: 'BBC Sports',   url: 'https://feeds.bbci.co.uk/sport/basketball/rss.xml' },
];
const RSS_PROXY = 'https://api.rss2json.com/v1/api.json?rss_url=';
const TRANSLATE_API = 'https://api.mymemory.translated.net/get?langpair=en|ja&q=';

let rssLoaded = false;

async function translateText(text) {
  if (!text) return '';
  try {
    const res  = await fetch(`${TRANSLATE_API}${encodeURIComponent(text.slice(0, 400))}`);
    const data = await res.json();
    return data?.responseData?.translatedText || text;
  } catch(e) {
    return text;
  }
}

function timeAgo(dateStr) {
  const diff = (Date.now() - new Date(dateStr)) / 1000 / 60;
  if (diff < 60)   return `${Math.floor(diff)}分前`;
  if (diff < 1440) return `${Math.floor(diff/60)}時間前`;
  return `${Math.floor(diff/1440)}日前`;
}

async function loadRSSNews() {
  if (rssLoaded) return;
  const feed = document.getElementById('rssFeed');
  if (!feed) return;
  feed.innerHTML = '<div class="rss-loading">📡 取得中...</div>';

  const allItems = [];

  for (const src of RSS_SOURCES) {
    try {
      const res  = await fetch(`${RSS_PROXY}${encodeURIComponent(src.url)}`);
      const data = await res.json();
      if (data.status === 'ok' && data.items) {
        data.items.slice(0, 5).forEach(item => {
          allItems.push({ ...item, sourceName: src.name });
        });
      }
    } catch(e) {}
  }

  if (!allItems.length) {
    feed.innerHTML = '<div class="rss-loading">⚠️ ニュースを取得できませんでした</div>';
    return;
  }

  // 日付順に並べる
  allItems.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

  feed.innerHTML = '<div class="rss-loading">🌐 日本語に翻訳中...</div>';

  const items = allItems.slice(0, 8);
  const translated = await Promise.all(
    items.map(async item => {
      const jaTitle = await translateText(item.title);
      const jaDesc  = item.description
        ? await translateText(item.description.replace(/<[^>]+>/g, '').slice(0, 200))
        : '';
      return { ...item, jaTitle, jaDesc };
    })
  );

  feed.innerHTML = translated.map(item => `
    <a class="rss-item" href="${item.link}" target="_blank" rel="noopener">
      <div class="rss-item-source">${item.sourceName} <span class="rss-badge">自動翻訳</span></div>
      <div class="rss-item-title">${item.jaTitle}</div>
      ${item.jaDesc ? `<div class="rss-item-ja">${item.jaDesc}</div>` : ''}
      <div class="rss-item-time">${timeAgo(item.pubDate)}</div>
    </a>
  `).join('');

  rssLoaded = true;
}
