name: Generate OGP Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate OGP HTML files
        run: python scripts/generate_ogp.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add articles/ sneakers/ assets/thumbnails/
          git diff --staged --quiet || git commit -m "Auto generate OGP pages"
          git push
